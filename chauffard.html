<title>Chauffard</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
  /* ============ TOKENS ============ */
  :root{
    --backdrop:#EDEAE2;
    --ground:#F4F2EC;
    --surface:#FFFFFF;
    --surface-2:#F7F5EF;
    --ink:#1A1E24;
    --ink-2:#54606E;
    --muted:#8A94A2;
    --line:#E4DFD5;
    --line-2:#EEEAE1;
    --accent:#D9992A;          /* jaune peinture routière — interactif / marque */
    --accent-ink:#241B03;
    --accent-soft:#F7ECD3;
    --pending:#E5720C;         /* 1 signalement */
    --pending-soft:#FBE6D2;
    --danger:#CE3F38;          /* chauffard confirmé (>= 2) */
    --danger-soft:#F7DDDB;
    --success:#2E9E63;
    --map-asphalt:#E7E3D9;
    --map-block:#F3EFE7;
    --map-street:#FFFFFF;
    --map-lane:#CBB87E;
    --map-river:#A9C7D6;
    --map-park:#CFE0C0;
    --shadow-1:0 1px 2px rgba(20,22,28,.06), 0 6px 20px rgba(20,22,28,.08);
    --shadow-2:0 -8px 40px rgba(20,22,28,.16);
    --cond:'Barlow Condensed','Arial Narrow',sans-serif;
    --sans:'Barlow','Inter','Segoe UI',system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --backdrop:#0B0E13;
      --ground:#10141A;
      --surface:#171C24;
      --surface-2:#1E242E;
      --ink:#ECEFF4;
      --ink-2:#AEB9C7;
      --muted:#6B7686;
      --line:#28303C;
      --line-2:#222A34;
      --accent:#F2B845;
      --accent-ink:#241B03;
      --accent-soft:#33291140;
      --pending:#FB8B3C;
      --pending-soft:#3a260f60;
      --danger:#F0564D;
      --danger-soft:#3a1a1860;
      --success:#3DD68C;
      --map-asphalt:#11161E;
      --map-block:#1A212B;
      --map-street:#2B3543;
      --map-lane:#4a4326;
      --map-river:#1C3A49;
      --map-park:#20331F;
      --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
      --shadow-2:0 -8px 44px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --backdrop:#0B0E13; --ground:#10141A; --surface:#171C24; --surface-2:#1E242E;
    --ink:#ECEFF4; --ink-2:#AEB9C7; --muted:#6B7686; --line:#28303C; --line-2:#222A34;
    --accent:#F2B845; --accent-ink:#241B03; --accent-soft:#33291140;
    --pending:#FB8B3C; --pending-soft:#3a260f60; --danger:#F0564D; --danger-soft:#3a1a1860;
    --success:#3DD68C;
    --map-asphalt:#11161E; --map-block:#1A212B; --map-street:#2B3543; --map-lane:#4a4326;
    --map-river:#1C3A49; --map-park:#20331F;
    --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
    --shadow-2:0 -8px 44px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  body{background:var(--backdrop);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45}
  button{font-family:inherit;color:inherit;cursor:pointer}
  h1,h2,h3{margin:0;font-family:var(--cond);font-weight:700;letter-spacing:.01em;text-wrap:balance}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* ============ APP SHELL ============ */
  .app{
    max-width:480px;margin:0 auto;min-height:100dvh;height:100dvh;
    display:flex;flex-direction:column;background:var(--ground);
    box-shadow:0 0 0 1px var(--line);overflow:hidden;position:relative;
  }
  @media (min-width:900px){ .app{margin-block:0;box-shadow:0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,.14)} }

  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:none;
  }
  .brand{display:flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:700;font-size:22px;letter-spacing:.03em;margin-right:auto}
  .brand svg{display:block}
  .icon-btn{
    display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-2);flex:none;
  }
  .icon-btn:hover{color:var(--ink);border-color:var(--muted)}
  .ic{width:20px;height:20px;display:block}

  .seg{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}
  .seg button{
    border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:12.5px;
    padding:6px 11px;border-radius:8px;letter-spacing:.01em;
  }
  .seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}

  /* ============ STAT STRIP ============ */
  .stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px 4px;flex:none}
  .stat-strip[hidden]{display:none}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:9px 11px;display:flex;flex-direction:column;gap:1px}
  .tile .n{font-family:var(--cond);font-weight:700;font-size:25px;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
  .tile .l{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.02em}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.pending{background:var(--pending)} .dot.danger{background:var(--danger)} .dot.muted{background:var(--muted)}

  .demo-chip{
    margin:6px 14px 0;font-size:11px;color:var(--ink-2);background:var(--surface-2);
    border:1px dashed var(--line);border-radius:8px;padding:5px 9px;text-align:center;flex:none;
  }
  .demo-chip[hidden]{display:none}

  /* ============ STAGE / VIEWS ============ */
  .stage{flex:1;min-height:0;padding:10px 14px 12px;display:flex}
  .view{flex:1;min-height:0;width:100%}
  .view[hidden]{display:none}
  .view.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* ---- Carte ---- */
  .view-carte{display:flex;flex-direction:column;gap:10px}
  .mapwrap{
    position:relative;flex:1;min-height:320px;border-radius:16px;overflow:hidden;
    border:1px solid var(--line);background:var(--map-asphalt);box-shadow:var(--shadow-1) inset;
  }
  .map{position:absolute;inset:0;width:100%;height:100%}
  .pins{position:absolute;inset:0;pointer-events:none}
  .pin{
    pointer-events:auto;position:absolute;width:16px;height:16px;border-radius:50%;
    transform:translate(-50%,-50%);border:2.5px solid var(--surface);
    background:var(--pending);box-shadow:0 2px 6px rgba(0,0,0,.35);padding:0;
    transition:width .12s,height .12s;
  }
  .pin.red{background:var(--danger)}
  .pin.sel{width:22px;height:22px;box-shadow:0 0 0 4px var(--accent-soft),0 2px 8px rgba(0,0,0,.4);z-index:5}
  .pin.live::after{
    content:"";position:absolute;inset:-6px;border-radius:50%;
    border:2px solid currentColor;color:inherit;
    animation:ping 1.8s ease-out infinite;
  }
  .pin.red.live::after{border-color:var(--danger)}
  .pin.live:not(.red)::after{border-color:var(--pending)}
  @keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.6);opacity:0}}

  .map-overlay{
    position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;
    align-items:flex-end;gap:8px;pointer-events:none;
  }
  .legend{
    display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--surface) 88%,transparent);
    border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:10.5px;color:var(--ink-2);
    backdrop-filter:blur(4px);
  }
  .legend i{display:inline-flex;align-items:center;gap:6px}
  .legend .sw{width:9px;height:9px;border-radius:50%;border:2px solid var(--surface)}
  .time-filter{
    display:flex;gap:2px;background:color-mix(in srgb,var(--surface) 88%,transparent);
    border:1px solid var(--line);border-radius:10px;padding:3px;pointer-events:auto;backdrop-filter:blur(4px);
  }
  .time-filter button{border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:11px;padding:5px 8px;border-radius:7px}
  .time-filter button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

  /* ---- Lists (Chauffards / Activité) ---- */
  .list{display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
  .list-head{font-family:var(--cond);font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:2px}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:36px 20px;border:1px dashed var(--line);border-radius:14px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
  button.card:hover{border-color:var(--muted)}
  .card-top{display:flex;align-items:center;gap:10px}
  .card-count{
    margin-left:auto;font-family:var(--cond);font-weight:700;font-size:22px;line-height:1;
    font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;
  }
  .card-count small{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.03em}
  .card-count.flag{color:var(--danger)}
  .card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
  .card-meta .v{display:inline-flex;align-items:center;gap:4px}
  .card-meta .v .ic{width:16px;height:16px}
  .sep-dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}

  .mini-chips{display:flex;flex-wrap:wrap;gap:5px}
  .mini-chip{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;
    background:var(--surface-2);border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;color:var(--ink-2);
  }
  .mini-chip .ic{width:13px;height:13px}
  .mini-chip b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

  .act-row{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 12px;width:100%;text-align:left}
  button.act-row:hover{border-color:var(--muted)}
  .act-time{font-size:10.5px;color:var(--muted);width:58px;flex:none;line-height:1.25;font-weight:500}
  .act-main{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .act-beh{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act-veh{width:20px;height:20px;color:var(--ink-2);flex:none}

  /* ---- Plate badge (EU) ---- */
  .plate{
    display:inline-flex;align-items:stretch;border:1.5px solid #12233a;border-radius:6px;overflow:hidden;
    background:#fff;color:#0b1b2b;font-family:var(--cond);font-weight:700;letter-spacing:.06em;
    box-shadow:0 1px 0 rgba(0,0,0,.18);font-size:15px;line-height:1;flex:none;
  }
  .plate .eu{background:#123a8f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 4px}
  .plate .eu svg{display:block}
  .plate .eu b{font-size:.72em;line-height:1}
  .plate .num{padding:4px 9px;display:flex;align-items:center;white-space:nowrap}
  .plate.lg{font-size:27px} .plate.lg .num{padding:6px 12px}
  .plate.sm{font-size:12.5px} .plate.sm .num{padding:3px 7px}

  /* ============ CTA BAR ============ */
  .cta-bar{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--ground);flex:none}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;
    border-radius:13px;font-weight:600;font-size:14px;padding:12px 16px;width:100%;letter-spacing:.01em;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-1)}
  .btn-primary:hover{filter:brightness(1.04)}
  .btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--muted)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn.big{font-size:15px;padding:14px 16px}
  .btn-report{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    background:var(--ink);color:var(--ground);border:0;border-radius:14px;
    font-weight:700;font-size:15px;padding:14px;letter-spacing:.02em;box-shadow:var(--shadow-1);
  }
  :root[data-theme="dark"] .btn-report,
  :root:not([data-theme="light"]) .btn-report{}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn-report{background:var(--accent);color:var(--accent-ink)} }
  :root[data-theme="dark"] .btn-report{background:var(--accent);color:var(--accent-ink)}
  .btn-report:active{transform:translateY(1px)}
  .btn-report .ic{width:20px;height:20px}

  .linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;padding:6px 2px}

  /* ============ SHEET ============ */
  .scrim{position:fixed;inset:0;background:rgba(12,14,20,.5);z-index:40;opacity:0;transition:opacity .2s}
  .scrim.show{opacity:1}
  .scrim[hidden]{display:none}
  .sheet{
    position:fixed;left:50%;transform:translateX(-50%) translateY(100%);
    bottom:0;width:100%;max-width:480px;z-index:41;
    background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow-2);
    display:flex;flex-direction:column;max-height:94dvh;
    transition:transform .26s cubic-bezier(.22,1,.36,1);
  }
  .sheet.show{transform:translateX(-50%) translateY(0)}
  .sheet[hidden]{display:none}
  .sheet-head{display:flex;align-items:center;gap:12px;padding:12px 14px 8px;flex:none}
  .rail{display:flex;gap:5px;flex:1}
  .rail i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .2s}
  .rail i.on{background:var(--accent)}
  .step-count{font-family:var(--cond);font-weight:600;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .sheet-body{padding:6px 18px 8px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .step-title{font-size:26px;margin-bottom:2px}
  .step-sub{color:var(--ink-2);font-size:13px;margin:0 0 16px}
  .sheet-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);flex:none;display:flex;gap:9px}
  .sheet-foot .btn{flex:1}

  /* ---- Step: lieu ---- */
  .pick-map{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:10/7;background:var(--map-asphalt);touch-action:manipulation}
  .pick-map svg{position:absolute;inset:0;width:100%;height:100%}
  .pick-pin{position:absolute;width:26px;height:26px;transform:translate(-50%,-100%);color:var(--danger);filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));pointer-events:none}
  .pick-hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:var(--ink-2);font-size:12.5px;font-weight:600;pointer-events:none;padding:0 20px}
  .geo-btn{margin-top:10px}

  /* ---- Step: comportements ---- */
  .b-group{margin-bottom:14px}
  .b-group h3{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .b-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .b-chip{
    display:flex;align-items:center;gap:9px;text-align:left;
    background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 11px;
    font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.2;
  }
  .b-chip .ic{width:20px;height:20px;color:var(--ink-2);flex:none}
  .b-chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
  .b-chip[aria-pressed="true"] .ic{color:var(--accent)}

  /* ---- Step: plaque ---- */
  .plate-entry{display:flex;align-items:stretch;gap:0;border:2px solid #12233a;border-radius:9px;overflow:hidden;background:#fff;margin:4px 0 16px;box-shadow:var(--shadow-1)}
  .plate-entry .eu{background:#123a8f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 8px}
  .plate-entry .eu b{font-size:13px}
  .plate-entry .slots{flex:1;display:flex;align-items:center;justify-content:center;gap:3px;padding:12px 8px}
  .slot{
    min-width:24px;height:38px;display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--cond);font-weight:700;font-size:30px;color:#0b1b2b;
    border-bottom:3px solid #cdd3da;letter-spacing:.02em;
  }
  .slot.has{border-bottom-color:#12233a}
  .slot.cur{border-bottom-color:var(--accent);animation:blink 1.1s step-end infinite}
  @keyframes blink{50%{border-bottom-color:#cdd3da}}
  .slot .sep,.slots .sep{border:0;color:#9aa3ad;font-size:22px;min-width:8px}
  .pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px}
  .key{
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    font-family:var(--cond);font-weight:600;font-size:19px;padding:11px 0;color:var(--ink);
  }
  .key:hover:not([disabled]){border-color:var(--muted)}
  .key:active{background:var(--accent-soft)}
  .key[disabled]{opacity:.3;pointer-events:none}
  .key-back{background:var(--surface);font-size:17px}
  .pmode-row{text-align:center;margin-top:12px}

  /* ---- Step: véhicule ---- */
  .v-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .v-btn{
    display:flex;flex-direction:column;align-items:center;gap:7px;
    background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:14px 6px 11px;
    font-weight:600;font-size:12px;color:var(--ink);
  }
  .v-btn .ic{width:30px;height:30px;color:var(--ink-2)}
  .v-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
  .v-btn[aria-pressed="true"] .ic{color:var(--accent)}

  /* ---- Step: recap ---- */
  .recap{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:4px}
  .recap-row{display:flex;align-items:center;gap:10px;padding:12px 13px;background:var(--surface);border-bottom:1px solid var(--line-2)}
  .recap-row:last-child{border-bottom:0}
  .recap-row .rk{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;width:82px;flex:none;line-height:1.25}
  .recap-row .rv{flex:1;font-size:13px;font-weight:600;color:var(--ink);min-width:0}
  .recap-row .rv.wrap{white-space:normal}
  .recap-row .rv .ic{width:18px;height:18px;display:inline-block;vertical-align:-4px;margin-right:4px}
  .recap-row .edit{color:var(--accent);width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;flex:none}
  .recap-row .edit .ic{width:15px;height:15px}

  /* ---- Done ---- */
  .done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:14px 4px 6px}
  .done .badge-ic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;flex:none}
  .done .badge-ic .ic{width:32px;height:32px}
  .done.ok .badge-ic{background:color-mix(in srgb,var(--success) 18%,transparent);color:var(--success)}
  .done.flag .badge-ic{background:var(--danger-soft);color:var(--danger)}
  .done h2{font-size:24px}
  .done p{color:var(--ink-2);font-size:13px;margin:0;max-width:34ch}
  .done .plate{margin:2px 0}
  .notify{
    width:100%;margin-top:6px;border:1px solid var(--line);border-radius:14px;padding:13px;
    background:var(--surface-2);display:flex;flex-direction:column;gap:10px;text-align:left;
  }
  .notify-head{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px}
  .notify-head .ic{width:19px;height:19px;color:var(--accent)}
  .switch{margin-left:auto;width:44px;height:26px;border-radius:999px;background:var(--line);border:0;padding:2px;flex:none;transition:background .16s}
  .switch span{display:block;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .16s}
  .switch[aria-checked="true"]{background:var(--success)}

  /* ---- Toast ---- */

    transition:opacity .18s,transform .18s;pointer-events:none;max-width:88vw;text-align:center;

<script>
(function(){

  var H=3600e3, DAY=864e5;

  /* =================== ICONS =================== */
  var ICONS = {

    coup:'<path d="M13 2l-3 8h5l-3 12"/><path d="M4.5 12H2M22 12h-2.5M5.5 5.5l1.6 1.6M17 17l1.6 1.6"/>',
    depass:'<path d="M7 21V8M7 8L4.2 10.8M7 8l2.8 2.8M16.5 21V4M16.5 4l-2.8 2.8M16.5 4l2.8 2.8"/>',
    pieton:'<circle cx="12" cy="4.3" r="2"/><path d="M12 6.5v7M12 9.4L8 11.5M12 9.4l4 2.1M12 13.5l-3 6.5M12 13.5l3 6.5"/>',
    tel:'<rect x="7.5" y="2.5" width="9" height="19" rx="2.2"/><path d="M10.5 18.5h3"/>',
    fuite:'<path d="M3 12h9M3.5 7.5h6M3.5 16.5h6"/><path d="M13 6l6 6-6 6"/>',
    voiture:'<path d="M4 13l1.9-4.6A3 3 0 0 1 8.7 6.4h6.6a3 3 0 0 1 2.8 1.9L20 13v5h-2.4M4 13v5h2.4M4 13h16M7.6 18a1.5 1.5 0 0 0 3 0M13.4 18a1.5 1.5 0 0 0 3 0"/>',
    taxi:'<path d="M4 13l1.9-4.6A3 3 0 0 1 8.7 6.4h6.6a3 3 0 0 1 2.8 1.9L20 13v5h-2.4M4 13v5h2.4M4 13h16M7.6 18a1.5 1.5 0 0 0 3 0M13.4 18a1.5 1.5 0 0 0 3 0"/><rect x="9" y="2.4" width="6" height="3" rx="1"/>',
    camion:'<path d="M2.5 7h11v9h-11zM13.5 10h4l3.2 3.2V16h-7.2z"/><path d="M6 18.5a1.7 1.7 0 0 0 3.4 0M15 18.5a1.7 1.7 0 0 0 3.4 0"/>',
    moto:'<circle cx="5.5" cy="16.5" r="3"/><circle cx="18.5" cy="16.5" r="3"/><path d="M5.5 16.5l4-6h6l3 6M9.5 10.5l-2-3H5m10.5 3l1.5-3H20"/>',
    utilitaire:'<path d="M2.5 7h12v9h-12zM14.5 9.5h3.4l2.6 3V16h-6z"/><path d="M6 18.5a1.7 1.7 0 0 0 3.4 0M15 18.5a1.7 1.7 0 0 0 3.4 0"/>',
    bus:'<rect x="3" y="4" width="18" height="13" rx="2.2"/><path d="M3 11h18M8 4v7M13 4v7M18 4v7"/><path d="M6.5 19.5a1.7 1.7 0 0 0 3.4 0M14.5 19.5a1.7 1.7 0 0 0 3.4 0"/>'
  };
  function ic(name,cls){
    return '<svg class="ic '+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||'')+'</svg>';
  }
  var EU_STARS=(function(){var p='';for(var i=0;i<12;i++){var a=i/12*Math.PI*2;p+='<circle cx="'+(10+7*Math.cos(a)).toFixed(1)+'" cy="'+(10+7*Math.sin(a)).toFixed(1)+'" r="1.05" fill="#f5d20a"/>';}return '<svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true">'+p+'</svg>';})();

  /* =================== DATA MODEL =================== */
  var BEHAVIORS=[
    {g:'Sur la route',items:[
      {id:'agressive',l:'Conduite agressive'},
      {id:'vitesse',l:'Excès de vitesse'},
      {id:'queue',l:'Queue de poisson'},
      {id:'talon',l:'Collé au pare-chocs'},
      {id:'feu',l:'Feu rouge grillé'}
    ]},
    {g:'Envers moi',items:[
      {id:'insulte',l:'Insulte, geste obscène'},
      {id:'menace',l:'Menace, intimidation'},
      {id:'klaxon',l:'Klaxon abusif'},
      {id:'phares',l:'Appels de phares'},
      {id:'freinage',l:'Freinage punitif'}
    ]},
    {g:'Incident',items:[
      {id:'coup',l:'Coup porté à la voiture'},
      {id:'depass',l:'Dépassement dangereux'},
      {id:'pieton',l:'A mis un piéton en danger'},
      {id:'tel',l:'Téléphone au volant'},
      {id:'fuite',l:'Délit de fuite'}
    ]}
  ];
  var BLABEL={}; BEHAVIORS.forEach(function(gr){gr.items.forEach(function(it){BLABEL[it.id]=it.l;});});
  var VEHICLES=[['voiture','Voiture'],['taxi','Taxi'],['camion','Camion'],['moto','Moto'],['utilitaire','Utilitaire'],['bus','Bus / car']];
  var VLABEL={}; VEHICLES.forEach(function(v){VLABEL[v[0]]=v[1];});

  var FR_LETTERS="ABCDEFGHJKLMNPQRSTVWXYZ".split(''); // sans I, O, U
  var DIGITS="0123456789".split('');
  var ALNUM=DIGITS.concat("ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(''));
  var FR_MASK=['L','L','D','D','D','L','L'];
  var FILTERS={direct:2*H,'24h':DAY,'7j':7*DAY,tout:Infinity};
  var GEO_BOX={latMin:48.815,latMax:48.902,lngMin:2.255,lngMax:2.415};

  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function geoToXY(lat,lng){
    return {
      x:clamp((lng-GEO_BOX.lngMin)/(GEO_BOX.lngMax-GEO_BOX.lngMin),.04,.96),
      y:clamp(1-(lat-GEO_BOX.latMin)/(GEO_BOX.latMax-GEO_BOX.latMin),.05,.95)
    };
  }
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function ago(ts){
    var s=(Date.now()-ts)/1000;
    if(s<60)return "à l'instant";
    var m=s/60; if(m<60)return "il y a "+Math.floor(m)+" min";
    var h=m/60; if(h<24)return "il y a "+Math.floor(h)+" h";
    var d=h/24; if(d<2)return "hier";
    if(d<7)return "il y a "+Math.floor(d)+" j";
    return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  }
  function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

  /* =================== STATE =================== */
  var state={
    db:null,
    view:lsGet('chauffard_view')||'carte',
    filter:lsGet('chauffard_filter')||'7j',
    reporterId:lsGet('chauffard_reporter')||(function(){var v=uid();lsSet('chauffard_reporter',v);return v;})(),
    remote:[], demo:[], reports:[], stats:new Map(),
    selectedPlate:null,
    sheetMode:null, sheetReturn:null,
    draft:null
  };

  var DEMO=[
    {plate:'FE274QA',vehicle:'camion',behaviors:['talon','klaxon','agressive'],x:.29,y:.34,ts:Date.now()-0.6*H},
    {plate:'FE274QA',vehicle:'camion',behaviors:['agressive','depass'],x:.63,y:.55,ts:Date.now()-2*DAY},
    {plate:'FE274QA',vehicle:'camion',behaviors:['menace'],x:.46,y:.72,ts:Date.now()-4*DAY},
    {plate:'BX905RT',vehicle:'taxi',behaviors:['queue','klaxon'],x:.71,y:.27,ts:Date.now()-1.3*H},
    {plate:'BX905RT',vehicle:'taxi',behaviors:['pieton'],x:.5,y:.41,ts:Date.now()-3*DAY},
    {plate:'AD118GM',vehicle:'voiture',behaviors:['feu','vitesse'],x:.37,y:.6,ts:Date.now()-5*H},
    {plate:'AD118GM',vehicle:'voiture',behaviors:['talon'],x:.2,y:.5,ts:Date.now()-6*DAY},
    {plate:'CK640PL',vehicle:'moto',behaviors:['vitesse','depass'],x:.82,y:.66,ts:Date.now()-9*H},
    {plate:'GT351HB',vehicle:'voiture',behaviors:['insulte','klaxon'],x:.55,y:.2,ts:Date.now()-1.1*DAY},
    {plate:'HN034VF',vehicle:'utilitaire',behaviors:['talon'],x:.33,y:.82,ts:Date.now()-2.4*DAY},
    {plate:'EB556LP',vehicle:'voiture',behaviors:['freinage','phares'],x:.66,y:.78,ts:Date.now()-40*60*1000},
    {plate:'RD902MC',vehicle:'bus',behaviors:['priorite','queue'].filter(function(x){return BLABEL[x];}),x:.14,y:.24,ts:Date.now()-3.6*DAY}
  ].map(function(r){r.id='demo-'+Math.random().toString(36).slice(2,9);r.plateFmt=fmtFr(r.plate);if(!r.behaviors.length)r.behaviors=['agressive'];return r;});

  function fmtFr(raw){
    if(!raw)return '';
    if(/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(raw))return raw.slice(0,2)+'-'+raw.slice(2,5)+'-'+raw.slice(5,7);
    return raw;
  }

  /* =================== MAP (schematic SVG) =================== */
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function buildMapSVG(){
    var r=mulberry32(20260907), W=1000, Hh=700, s='';
    s+='<rect x="0" y="0" width="'+W+'" height="'+Hh+'" fill="var(--map-asphalt)"/>';
    var cols=7, rows=5, gx=20, gy=20;
    var cw=(W-gx*(cols+1))/cols, ch=(Hh-gy*(rows+1))/rows;
    for(var i=0;i<cols;i++)for(var j=0;j<rows;j++){
      if((i===1||i===2)&&j===3)continue;
      if(i===5&&(j===0||j===1))continue;
      var x=gx+i*(cw+gx)+(r()-.5)*5, y=gy+j*(ch+gy)+(r()-.5)*5;
      s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+ch.toFixed(1)+'" rx="3" fill="var(--map-block)"/>';
    }
    s+='<rect x="'+(gx+1*(cw+gx)).toFixed(1)+'" y="'+(gy+3*(ch+gy)).toFixed(1)+'" width="'+(cw*2+gx).toFixed(1)+'" height="'+ch.toFixed(1)+'" rx="12" fill="var(--map-park)"/>';
    s+='<rect x="'+(gx+5*(cw+gx)).toFixed(1)+'" y="'+(gy+0*(ch+gy)).toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+(ch*2+gy).toFixed(1)+'" rx="12" fill="var(--map-park)"/>';
    s+='<line x1="-40" y1="130" x2="1040" y2="560" stroke="var(--map-street)" stroke-width="26" stroke-linecap="round"/>';
    s+='<line x1="-40" y1="130" x2="1040" y2="560" stroke="var(--map-lane)" stroke-width="2.5" stroke-dasharray="16 13"/>';
    s+='<path d="M -20 470 Q 240 405 430 485 T 900 440 L 1040 458 L 1040 720 L -20 720 Z" fill="var(--map-river)" opacity=".5"/>';
    s+='<path d="M -20 470 Q 240 405 430 485 T 900 440 L 1040 458" fill="none" stroke="var(--map-river)" stroke-width="3"/>';
    for(var k=0;k<3;k++){var cx=140+r()*720, cy=90+r()*500;s+='<circle cx="'+cx.toFixed(0)+'" cy="'+cy.toFixed(0)+'" r="8" fill="none" stroke="var(--map-street)" stroke-width="7"/>';}
    return s;
  }
  var MAP_SVG=buildMapSVG();

  /* =================== RECOMPUTE =================== */
  function recompute(){
    var src=state.db?state.remote:state.demo;
    state.reports=src.slice().sort(function(a,b){return b.ts-a.ts;});
    var m=new Map();
    state.reports.forEach(function(rp){
      var e=m.get(rp.plate);
      if(!e){e={plate:rp.plate,plateFmt:rp.plateFmt||fmtFr(rp.plate),count:0,vehicle:rp.vehicle,lastTs:rp.ts,firstTs:rp.ts,behaviors:{},x:rp.x,y:rp.y,reports:[]};m.set(rp.plate,e);}
      e.count++;
      e.reports.push(rp);
      e.lastTs=Math.max(e.lastTs,rp.ts);
      e.firstTs=Math.min(e.firstTs,rp.ts);
      (rp.behaviors||[]).forEach(function(b){e.behaviors[b]=(e.behaviors[b]||0)+1;});
    });
    state.stats=m;
  }
  function topBehaviors(e,n){
    return Object.keys(e.behaviors).sort(function(a,b){return e.behaviors[b]-e.behaviors[a];}).slice(0,n||3);
  }

  /* =================== RENDER: stat strip =================== */
  function renderStatStrip(){
    var strip=$('#statStrip');
    if(state.view!=='carte'){strip.hidden=true;return;}
    strip.hidden=false;
    var now=Date.now();
    var live=state.reports.filter(function(x){return now-x.ts<2*H;}).length;
    var flagged=0; state.stats.forEach(function(e){if(e.count>=2)flagged++;});
    var wk=state.reports.filter(function(x){return now-x.ts<7*DAY;}).length;
    strip.innerHTML=
      tile(live,'en direct','pending')+
      tile(flagged,'chauffards','danger')+
      tile(wk,'sur 7 jours','muted');
  }
  function tile(n,label,tone){
    return '<div class="tile"><span class="n"><span class="dot '+tone+'"></span>'+n+'</span><span class="l">'+label+'</span></div>';
  }

  /* =================== RENDER: pins =================== */
  function renderPins(){
    var wrap=$('#pins'), now=Date.now(), span=FILTERS[state.filter];

    wrap.innerHTML=vis.map(function(rp){
      var e=state.stats.get(rp.plate)||{count:1};
      var red=e.count>=2, live=now-rp.ts<2*H, sel=state.selectedPlate===rp.plate;
      return '<button class="pin'+(red?' red':'')+(live?' live':'')+(sel?' sel':'')+'" '+
        'style="left:'+(rp.x*100).toFixed(2)+'%;top:'+(rp.y*100).toFixed(2)+'%" '+
        'data-plate="'+esc(rp.plate)+'" aria-label="Signalement '+esc(rp.plateFmt||rp.plate)+'"></button>';
    }).join('');
  }

  /* =================== RENDER: plate badge =================== */
  function plateBadge(fmt,size){
    return '<span class="plate'+(size?' '+size:'')+'"><span class="eu">'+EU_STARS+'<b>F</b></span><span class="num">'+esc(fmt||'—')+'</span></span>';
  }

  /* =================== RENDER: Chauffards =================== */
  function renderChauffards(){
    var box=$('#chauffardList');
    var arr=[]; state.stats.forEach(function(e){if(e.count>=2)arr.push(e);});
    arr.sort(function(a,b){return b.count-a.count||b.lastTs-a.lastTs;});
    if(!arr.length){box.innerHTML='<div class="empty">Aucun chauffard pour l’instant.<br>Une plaque signalée 2 fois apparaît ici.</div>';return;}
    box.innerHTML='<div class="list-head">'+arr.length+' véhicule'+(arr.length>1?'s':'')+' signalé'+(arr.length>1?'s':'')+' plusieurs fois</div>'+
      arr.map(function(e){
        var beh=topBehaviors(e,3).map(function(b){return '<span class="mini-chip">'+ic(b)+BLABEL[b]+' <b>'+e.behaviors[b]+'</b></span>';}).join('');
        return '<button class="card" data-plate="'+esc(e.plate)+'">'+
          '<div class="card-top">'+plateBadge(e.plateFmt)+
            '<span class="card-count flag">×'+e.count+'<small>signalements</small></span></div>'+
          '<div class="card-meta"><span class="v">'+ic(e.vehicle)+VLABEL[e.vehicle]+'</span>'+
            '<span class="sep-dot"></span><span>vu '+ago(e.lastTs)+'</span></div>'+
          '<div class="mini-chips">'+beh+'</div>'+
        '</button>';
      }).join('');
  }

  /* =================== RENDER: Activité =================== */
  function renderActivite(){
    var box=$('#activiteList');
    if(!state.reports.length){box.innerHTML='<div class="empty">Aucun signalement enregistré.</div>';return;}
    box.innerHTML='<div class="list-head">Derniers signalements</div>'+
      state.reports.slice(0,60).map(function(rp){
        var e=state.stats.get(rp.plate)||{count:1};
        var labels=(rp.behaviors||[]).map(function(b){return BLABEL[b];});
        var behTxt=labels.slice(0,2).join(', ')+(labels.length>2?' +'+(labels.length-2):'');
        return '<button class="act-row" data-plate="'+esc(rp.plate)+'">'+
          '<span class="act-time">'+ago(rp.ts)+'</span>'+
          '<span class="act-main">'+plateBadge(rp.plateFmt||fmtFr(rp.plate),'sm')+
            '<span class="act-beh">'+esc(behTxt)+'</span></span>'+
          (e.count>=2?'<span class="mini-chip" style="color:var(--danger)">×'+e.count+'</span>':'')+
          ic(rp.vehicle,'act-veh')+
        '</button>';
      }).join('');
  }

  function renderAll(){
    recompute();
    renderStatStrip();
    renderPins();
    renderChauffards();
    renderActivite();
    if(state.sheetMode==='detail'&&state.selectedPlate)openDetail(state.selectedPlate,true);
  }

  /* =================== VIEW SWITCH =================== */
  function setView(v){
    state.view=v; lsSet('chauffard_view',v);
    ['carte','chauffards','activite'].forEach(function(name){
      $('#view-'+name).hidden=(name!==v);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#seg button'),function(b){
      b.setAttribute('aria-selected',String(b.dataset.view===v));
    });
    renderStatStrip();
  }

  /* =================== SHEET PLUMBING =================== */
  function openSheet(){
    state.sheetReturn=document.activeElement;
    var sc=$('#scrim'), sh=$('#sheet');
    sc.hidden=false; sh.hidden=false;
    requestAnimationFrame(function(){sc.classList.add('show');sh.classList.add('show');});
    document.addEventListener('keydown',onSheetKey);
  }
  function closeSheet(){
    var sc=$('#scrim'), sh=$('#sheet');
    sc.classList.remove('show'); sh.classList.remove('show');
    document.removeEventListener('keydown',onSheetKey);
    setTimeout(function(){sc.hidden=true;sh.hidden=true;sh.innerHTML='';},260);
    state.sheetMode=null; state.draft=null;
    if(state.sheetReturn&&state.sheetReturn.focus)try{state.sheetReturn.focus();}catch(e){}
  }
  function onSheetKey(e){ if(e.key==='Escape')closeSheet(); }
  $('#scrim').addEventListener('click',closeSheet);

  /* =================== TOAST =================== */
  var toastT;
  function toast(msg){
    var t=$('#toast'); t.textContent=msg; t.hidden=false;
    requestAnimationFrame(function(){t.classList.add('show');});
    clearTimeout(toastT);
    toastT=setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.hidden=true;},200);},2200);
  }

  /* =================== DETAIL SHEET =================== */
  function openDetail(plate,keepScroll){
    var e=state.stats.get(plate);
    if(!e){return;}
    state.sheetMode='detail'; state.selectedPlate=plate; renderPins();
    var flagged=e.count>=2;
    var scrollTop=keepScroll?(($('#sheetBody')||{}).scrollTop||0):0;
    var beh=topBehaviors(e,6).map(function(b){return '<span class="mini-chip">'+ic(b)+BLABEL[b]+' <b>'+e.behaviors[b]+'</b></span>';}).join('');
    var hist=e.reports.slice().sort(function(a,b){return b.ts-a.ts;}).map(function(rp){
      return '<div class="hist-row"><span class="ht">'+ago(rp.ts)+'</span>'+
        '<span class="hb">'+(rp.behaviors||[]).map(function(b){return BLABEL[b];}).join(' · ')+'</span>'+
        ic(rp.vehicle,'hv')+'</div>';
    }).join('');
    var mini='<div class="pick-map" style="pointer-events:none"><svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice">'+MAP_SVG+'</svg>'+
      e.reports.map(function(rp){return '<span class="pin'+(flagged?' red':'')+'" style="left:'+(rp.x*100).toFixed(1)+'%;top:'+(rp.y*100).toFixed(1)+'%"></span>';}).join('')+'</div>';
    var sh=$('#sheet');
    sh.innerHTML=
      '<div class="sheet-head"><button class="icon-btn" id="dClose" aria-label="Fermer">'+ic('close')+'</button>'+
        '<div class="rail"></div></div>'+
      '<div class="sheet-body" id="sheetBody">'+
        '<div class="detail-head">'+plateBadge(e.plateFmt,'lg')+
          '<span class="detail-status '+(flagged?'flag':'one')+'">'+
            (flagged?ic('menace'):ic('location'))+
            (flagged?('Chauffard — '+e.count+' signalements'):'1 signalement')+'</span>'+
          '<div class="card-meta"><span class="v">'+ic(e.vehicle)+VLABEL[e.vehicle]+'</span>'+
            '<span class="sep-dot"></span><span>dernier '+ago(e.lastTs)+'</span></div>'+
        '</div>'+
        mini+
        '<div class="sub-label">Ce qui est reproché</div><div class="mini-chips">'+beh+'</div>'+
        '<div class="sub-label">Historique</div><div class="hist">'+hist+'</div>'+
        (flagged?('<div class="notify" id="dNotify"><div class="notify-head">'+ic('bell')+'M’alerter au prochain signalement'+
          '<button class="switch" id="dSwitch" role="switch" aria-checked="false"><span></span></button></div>'+
          '<div class="notify-body" id="dNotifyBody"><input type="email" id="dEmail" placeholder="votre@email.fr" autocomplete="email" inputmode="email">'+
          '<button class="btn btn-primary" id="dSaveEmail">Activer l’alerte</button>'+
          '<span class="hint">Enregistré sur cette page. L’envoi d’e-mail réel nécessite un service de messagerie ; en attendant, l’alerte s’affiche ici.</span></div></div>'):'')+
      '</div>'+
      '<div class="sheet-foot"><button class="btn btn-primary" id="dReport">'+ic('menace')+' Signaler ce véhicule</button></div>';
    if(!$('#scrim').classList.contains('show'))openSheet();
    $('#sheetBody').scrollTop=scrollTop;
    $('#dClose').onclick=closeSheet;
    $('#dReport').onclick=function(){openReport({plate:e.plate,plateFmt:e.plateFmt,vehicle:e.vehicle});};
    if(flagged)wireNotify($('#dSwitch'),$('#dNotifyBody'),$('#dEmail'),$('#dSaveEmail'),$('#dNotify'),e.plate,e.plateFmt);
  }

  function wireNotify(sw,body,input,saveBtn,box,plate,plateFmt){
    sw.onclick=function(){
      var on=sw.getAttribute('aria-checked')!=='true';
      sw.setAttribute('aria-checked',String(on));
      body.classList.toggle('open',on);
      if(on)setTimeout(function(){input.focus();},60);
    };
    saveBtn.onclick=function(){
      var v=(input.value||'').trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast('E-mail non valide');return;}
      saveWatcher(plate,plateFmt,v).then(function(){
        box.classList.add('saved');
        body.innerHTML='<span class="saved-line">'+ic('check')+'Alerte activée pour '+esc(plateFmt)+'</span>'+
          '<span class="hint">La plaque reste marquée en rouge. Vous verrez une alerte au prochain signalement.</span>';
      }).catch(function(){toast('Enregistrement impossible');});
    };
  }
  function saveWatcher(plate,plateFmt,email){
    if(!state.db)return Promise.resolve();
    var ref=state.db.doc('plates/'+plate);
    return ref.get().then(function(snap){
      var cur=snap.exists&&snap.data().watchers?snap.data().watchers.slice():[];
      if(cur.indexOf(email)<0)cur.push(email);
      return ref.set({plate:plate,plateFmt:plateFmt,watchers:cur,updated:Date.now()});
    });
  }

  /* =================== INFO SHEET =================== */
  function openInfo(){
    state.sheetMode='info';
    var sh=$('#sheet');
    sh.innerHTML=
      '<div class="sheet-head"><button class="icon-btn" id="iClose" aria-label="Fermer">'+ic('close')+'</button><div class="rail"></div></div>'+
      '<div class="sheet-body info-body">'+
        '<h2 id="sheetTitle" class="step-title">À propos</h2>'+
        '<p><b>Chauffard</b> recense des signalements de conduite dangereuse, partagés entre les personnes qui ouvrent cette page.</p>'+
        '<p>Une plaque signalée <b>au moins 2 fois</b> est automatiquement marquée comme chauffard : point rouge sur la carte et fiche dans l’onglet <b>Chauffards</b>.</p>'+
        '<p>La carte est <b>schématique</b> : une vraie carte rue par rue demande un fournisseur de tuiles externe. La position GPS réelle est tout de même enregistrée avec chaque signalement.</p>'+
        '<p>Les <b>plaques d’immatriculation sont des données personnelles</b>. Signalez des faits, pas des personnes. Aucun signalement n’est transmis aux autorités.</p>'+
        '<p>Les alertes e-mail sont <b>enregistrées</b> mais l’envoi réel demande un service de messagerie ; en attendant, l’alerte apparaît dans l’application.</p>'+
      '</div>'+
      '<div class="sheet-foot"><button class="btn btn-primary" id="iOk">J’ai compris</button></div>';
    openSheet();
    $('#iClose').onclick=closeSheet; $('#iOk').onclick=closeSheet;
  }

  /* =================== REPORT FLOW =================== */
  function openReport(prefill){
    state.sheetMode='report';
    state.draft={step:1,loc:null,behaviors:[],plate:[],plateMode:'fr',plateNorm:'',plateFmt:'',vehicle:null,_prev:0};
    if(prefill&&prefill.plate){
      state.draft.plate=prefill.plate.split('');
      state.draft.plateNorm=prefill.plate;
      state.draft.plateFmt=prefill.plateFmt||fmtFr(prefill.plate);
      state.draft.plateMode=/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(prefill.plate)?'fr':'autre';
    }
    if(prefill&&prefill.vehicle)state.draft.vehicle=prefill.vehicle;
    if(state.sheetMode==='report'&&$('#sheet').hidden)openSheet();
    else if(!$('#scrim').classList.contains('show'))openSheet();
    renderStep();
  }

  function renderStep(){
    var d=state.draft, sh=$('#sheet');
    if(d.step>=6){renderDone();return;}
    var T={
      1:['Où est-ce arrivé ?','Touchez la carte à l’endroit de l’incident.'],
      2:['Qu’a-t-il fait ?','Choisissez tout ce qui s’applique — pas besoin d’écrire.'],
      3:['Sa plaque','Composez la plaque touche par touche.'],
      4:['Quel véhicule ?','Un seul choix.'],
      5:['On vérifie','Un détail à corriger ?']
    }[d.step];
    sh.innerHTML=
      '<div class="sheet-head">'+
        '<button class="icon-btn" id="stepBack" aria-label="'+(d.step===1?'Fermer':'Retour')+'">'+ic(d.step===1?'close':'back')+'</button>'+
        '<div class="rail" aria-hidden="true">'+[1,2,3,4,5].map(function(n){return '<i class="'+(n<=d.step?'on':'')+'"></i>';}).join('')+'</div>'+
        '<span class="step-count">'+d.step+'/5</span>'+
      '</div>'+
      '<div class="sheet-body" id="sheetBody">'+
        '<h2 id="sheetTitle" class="step-title">'+T[0]+'</h2><p class="step-sub">'+T[1]+'</p>'+
        '<div id="stepArea"></div>'+
      '</div>'+
      '<div class="sheet-foot" id="sheetFoot"></div>';
    var area=$('#stepArea'), foot=$('#sheetFoot');
    ({1:stepLoc,2:stepWhat,3:stepPlate,4:stepVehicle,5:stepRecap})[d.step](area,foot);
    $('#stepBack').onclick=function(){ if(d.step===1){closeSheet();} else {d.step--;renderStep();} };
  }

  function nextBtn(label,onClick,disabled){
    var b=document.createElement('button');
    b.className='btn btn-primary big'; b.textContent=label||'Continuer';
    if(disabled)b.disabled=true;
    b.onclick=onClick;
    return b;
  }

  /* ---- Step 1: lieu ---- */
  function stepLoc(area,foot){
    var d=state.draft;
    area.innerHTML=
      '<div class="pick-map" id="pickMap"><svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice">'+MAP_SVG+'</svg>'+
        '<div class="pick-hint" id="pickHint">Touchez la carte</div>'+
      '</div>'+
      '<button class="btn btn-ghost geo-btn" id="geoBtn">'+ic('crosshair')+' Utiliser ma position</button>';
    var next=nextBtn('Continuer',function(){d.step=2;renderStep();},!d.loc);
    foot.appendChild(next);
    var pm=$('#pickMap');
    function place(x,y,src){
      d.loc={x:clamp(x,.03,.97),y:clamp(y,.03,.97)};
      if(src&&src.lat!=null){d.loc.lat=src.lat;d.loc.lng=src.lng;}
      var old=pm.querySelector('.pick-pin'); if(old)old.remove();
      var p=document.createElement('div'); p.className='pick-pin';
      p.style.left=(d.loc.x*100)+'%'; p.style.top=(d.loc.y*100)+'%';
      p.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 23s-7-6.2-7-12A7 7 0 0 1 19 11c0 5.8-7 12-7 12z"/><circle cx="12" cy="11" r="3" fill="#fff"/></svg>';
      pm.appendChild(p);
      $('#pickHint').style.display='none';
      next.disabled=false;
    }
    pm.addEventListener('click',function(e){
      var rc=pm.getBoundingClientRect();
      place((e.clientX-rc.left)/rc.width,(e.clientY-rc.top)/rc.height);
    });
    $('#geoBtn').onclick=function(){
      if(!navigator.geolocation){toast('Géolocalisation indisponible');return;}
      $('#geoBtn').textContent='Localisation…';
      navigator.geolocation.getCurrentPosition(function(pos){
        var xy=geoToXY(pos.coords.latitude,pos.coords.longitude);
        place(xy.x,xy.y,{lat:pos.coords.latitude,lng:pos.coords.longitude});
        $('#geoBtn').innerHTML=ic('check')+' Position ajoutée';
      },function(){
        $('#geoBtn').innerHTML=ic('crosshair')+' Utiliser ma position';
        toast('Position refusée — choisissez sur la carte');
      },{timeout:8000,maximumAge:60000});
    };
  }

  /* ---- Step 2: comportements ---- */
  function stepWhat(area,foot){
    var d=state.draft;
    area.innerHTML=BEHAVIORS.map(function(gr){
      return '<div class="b-group"><h3>'+gr.g+'</h3><div class="b-grid">'+
        gr.items.map(function(it){
          var on=d.behaviors.indexOf(it.id)>=0;
          return '<button class="b-chip" data-id="'+it.id+'" aria-pressed="'+on+'">'+ic(it.id)+'<span>'+it.l+'</span></button>';
        }).join('')+'</div></div>';
    }).join('');
    var next=nextBtn('Continuer',function(){d.step=3;renderStep();},d.behaviors.length===0);
    foot.appendChild(next);
    area.addEventListener('click',function(e){
      var b=e.target.closest('.b-chip'); if(!b)return;
      var id=b.dataset.id, i=d.behaviors.indexOf(id);
      if(i>=0)d.behaviors.splice(i,1); else d.behaviors.push(id);
      b.setAttribute('aria-pressed',String(i<0));
      next.disabled=d.behaviors.length===0;
      next.textContent=d.behaviors.length?('Continuer ('+d.behaviors.length+')'):'Continuer';
      if(navigator.vibrate)navigator.vibrate(6);
    });
  }

  /* ---- Step 3: plaque ---- */
  function plateInfo(d){
    var raw=d.plate.join('');
    if(d.plateMode==='fr'){
      var ok=/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(raw);
      var fmt=raw.length?(raw.slice(0,2)+(raw.length>2?'-':'')+raw.slice(2,5)+(raw.length>5?'-':'')+raw.slice(5,7)):'';
      return {raw:raw,ok:ok,fmt:fmt};
    }
    return {raw:raw,ok:raw.length>=4,fmt:raw};
  }
  function stepPlate(area,foot){
    var d=state.draft;
    area.innerHTML=
      '<div class="plate-entry"><span class="eu">'+EU_STARS+'<b>F</b></span><span class="slots" id="peSlots"></span></div>'+
      '<div class="pad" id="pad"></div>'+
      '<div class="pmode-row"><button class="linkbtn" id="pmode"></button></div>';
    foot.appendChild(nextBtn('Continuer',function(){
      var i=plateInfo(d); d.plateNorm=i.raw; d.plateFmt=i.fmt||i.raw; d.step=4; renderStep();
    },true));
    var next=foot.querySelector('.btn');
    function paint(){
      var info=plateInfo(d);
      var mask=d.plateMode==='fr'?FR_MASK:['X','X','X','X','X','X','X','X','X'];
      var cur=d.plate.length, slotsHtml='';
      mask.forEach(function(m,idx){
        if(d.plateMode==='fr'&&(idx===2||idx===5))slotsHtml+='<span class="sep">–</span>';
        var ch=d.plate[idx]||'';
        slotsHtml+='<span class="slot'+(ch?' has':'')+(idx===cur?' cur':'')+'">'+ch+'</span>';
      });
      $('#peSlots').innerHTML=slotsHtml;
      var max=d.plateMode==='fr'?7:9;
      var type=d.plateMode==='fr'?mask[Math.min(cur,6)]:'X';
      var keys=d.plateMode==='fr'?(type==='L'?FR_LETTERS:DIGITS):ALNUM;
      var padHtml=keys.map(function(k){return '<button class="key" data-k="'+k+'"'+(cur>=max?' disabled':'')+'>'+k+'</button>';}).join('');
      padHtml+='<button class="key key-back" data-k="__back" aria-label="Effacer">⌫</button>';
      $('#pad').innerHTML=padHtml;
      $('#pmode').textContent=d.plateMode==='fr'?'Plaque étrangère ou ancien format':'Revenir au format français';
      next.disabled=!info.ok;
    }
    $('#pad').addEventListener('click',function(e){
      var b=e.target.closest('.key'); if(!b)return;
      var k=b.dataset.k, max=d.plateMode==='fr'?7:9;
      if(k==='__back')d.plate.pop();
      else if(d.plate.length<max)d.plate.push(k);
      if(navigator.vibrate)navigator.vibrate(5);
      paint();
    });
    $('#pmode').onclick=function(){
      d.plateMode=d.plateMode==='fr'?'autre':'fr'; d.plate=[]; paint();
    };
    paint();
  }

  /* ---- Step 4: véhicule ---- */
  function stepVehicle(area,foot){
    var d=state.draft;
    area.innerHTML='<div class="v-grid">'+VEHICLES.map(function(v){
      return '<button class="v-btn" data-v="'+v[0]+'" aria-pressed="'+(d.vehicle===v[0])+'">'+ic(v[0])+'<span>'+v[1]+'</span></button>';
    }).join('')+'</div>';
    var next=nextBtn('Continuer',function(){d.step=5;renderStep();},!d.vehicle);
    foot.appendChild(next);
    area.addEventListener('click',function(e){
      var b=e.target.closest('.v-btn'); if(!b)return;
      d.vehicle=b.dataset.v;
      Array.prototype.forEach.call(area.querySelectorAll('.v-btn'),function(x){x.setAttribute('aria-pressed',String(x.dataset.v===d.vehicle));});
      next.disabled=false;
      if(navigator.vibrate)navigator.vibrate(6);
    });
  }

  /* ---- Step 5: recap ---- */
  function stepRecap(area,foot){
    var d=state.draft, info=plateInfo(d);
    function row(k,vHtml,step,wrap){
      return '<div class="recap-row"><span class="rk">'+k+'</span><span class="rv'+(wrap?' wrap':'')+'">'+vHtml+'</span>'+
        '<button class="edit" data-step="'+step+'" aria-label="Modifier '+k+'">'+ic('edit')+'</button></div>';
    }
    area.innerHTML='<div class="recap">'+
      row('Lieu',(d.loc&&d.loc.lat!=null)?'Position GPS':'Placé sur la carte',1)+
      row('Comportement',d.behaviors.map(function(b){return BLABEL[b];}).join(', ')||'—',2,true)+
      row('Plaque',plateBadge(info.fmt||info.raw),3)+
      row('Véhicule',(d.vehicle?ic(d.vehicle):'')+' '+(VLABEL[d.vehicle]||'—'),4)+
    '</div>';
    var send=nextBtn('Envoyer le signalement',function(){
      if(!d.plateNorm){d.plateNorm=info.raw;d.plateFmt=info.fmt||info.raw;}
      d._prev=(state.stats.get(d.plateNorm)||{count:0}).count;
      send.disabled=true; send.textContent='Envoi…';
      submitReport().then(function(ok){
        if(ok){d.step=6;renderDone();}
        else{send.disabled=false;send.textContent='Envoyer le signalement';}
      });
    });
    foot.appendChild(send);
    area.addEventListener('click',function(e){
      var b=e.target.closest('.edit'); if(!b)return;
      d.step=+b.dataset.step; renderStep();
    });
  }

  function submitReport(){
    var d=state.draft, info=plateInfo(d);
    var rec={
      id:uid(),
      plate:d.plateNorm||info.raw,
      plateFmt:d.plateFmt||info.fmt||info.raw,
      vehicle:d.vehicle,
      behaviors:d.behaviors.slice(),
      x:d.loc.x, y:d.loc.y,
      lat:(d.loc.lat!=null?d.loc.lat:null),
      lng:(d.loc.lng!=null?d.loc.lng:null),
      ts:Date.now(),
      reporter:state.reporterId
    };
    if(state.db){
      return state.db.collection('reports').doc(rec.id).set(rec).then(function(){return true;}).catch(function(err){
        console.warn('report set',err&&err.code); toast('Enregistrement impossible'); return false;
      });
    }
    state.demo.unshift(rec); recompute(); renderAll();
    return Promise.resolve(true);
  }

  /* ---- Done ---- */
  function renderDone(){
    var d=state.draft, sh=$('#sheet');
    var total=(d._prev||0)+1;
    var flagged=total>=2;
    sh.innerHTML=
      '<div class="sheet-head"><div class="rail"></div><button class="icon-btn" id="doneX" aria-label="Fermer">'+ic('close')+'</button></div>'+
      '<div class="sheet-body">'+
        '<div class="done '+(flagged?'flag':'ok')+'">'+
          '<div class="badge-ic">'+ic(flagged?'menace':'check')+'</div>'+
          (flagged
            ? '<h2>Signalé '+total+' fois</h2><p>Ce véhicule est maintenant marqué comme <b>chauffard</b> : point rouge sur la carte et fiche dédiée.</p>'
            : '<h2>C’est enregistré</h2><p>Merci — votre signalement aide les autres conducteurs. À 2 signalements, la plaque sera marquée comme chauffard.</p>')+
          plateBadge(d.plateFmt,'lg')+
          (flagged
            ? '<div class="notify" id="dNotify"><div class="notify-head">'+ic('bell')+'Me prévenir au prochain signalement'+
              '<button class="switch" id="dSwitch" role="switch" aria-checked="false"><span></span></button></div>'+
              '<div class="notify-body" id="dNotifyBody"><input type="email" id="dEmail" placeholder="votre@email.fr" autocomplete="email" inputmode="email">'+
              '<button class="btn btn-primary" id="dSaveEmail">Activer l’alerte</button>'+
              '<span class="hint">Enregistré sur cette page. L’envoi d’e-mail réel nécessite un service de messagerie ; en attendant, l’alerte s’affiche ici.</span></div></div>'
            : '')+
        '</div>'+
      '</div>'+
      '<div class="sheet-foot">'+
        '<button class="btn btn-ghost" id="doneMap">Voir sur la carte</button>'+
        '<button class="btn btn-primary" id="doneClose">Terminé</button>'+
      '</div>';
    $('#doneX').onclick=closeSheet;
    $('#doneClose').onclick=closeSheet;
    $('#doneMap').onclick=function(){
      var plate=d.plateNorm; closeSheet();
      setTimeout(function(){ setView('carte'); state.selectedPlate=plate; renderPins(); openDetail(plate); },280);
    };
    if(flagged)wireNotify($('#dSwitch'),$('#dNotifyBody'),$('#dEmail'),$('#dSaveEmail'),$('#dNotify'),d.plateNorm,d.plateFmt);
    renderAll();
  }

  /* =================== WIRING =================== */
  $('#mapSvg').innerHTML=MAP_SVG;
  $('#btnInfo').innerHTML=ic('info');

  $('#seg').addEventListener('click',function(e){
    var b=e.target.closest('button[data-view]'); if(b)setView(b.dataset.view);
  });
  $('#btnInfo').onclick=openInfo;
  $('#btnReport').onclick=function(){openReport(null);};
  $('#timeFilter').addEventListener('click',function(e){
    var b=e.target.closest('button[data-f]'); if(!b)return;
    state.filter=b.dataset.f; lsSet('chauffard_filter',state.filter);
    Array.prototype.forEach.call($('#timeFilter').querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',String(x.dataset.f===state.filter));});
    renderPins();
  });
  Array.prototype.forEach.call($('#timeFilter').querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',String(x.dataset.f===state.filter));});

  $('#pins').addEventListener('click',function(e){
    var p=e.target.closest('.pin'); if(p&&p.dataset.plate)openDetail(p.dataset.plate);
  });
  $('#chauffardList').addEventListener('click',function(e){
    var c=e.target.closest('[data-plate]'); if(c)openDetail(c.dataset.plate);
  });
  $('#activiteList').addEventListener('click',function(e){
    var c=e.target.closest('[data-plate]'); if(c)openDetail(c.dataset.plate);
  });

  /* physical keyboard shortcut for the plate pad (bonus, UI stays tap-first) */
  document.addEventListener('keydown',function(e){
    if(state.sheetMode!=='report'||!state.draft||state.draft.step!==3)return;
    var d=state.draft, max=d.plateMode==='fr'?7:9;
    if(e.key==='Backspace'){d.plate.pop();}
    else if(e.key.length===1){
      var k=e.key.toUpperCase();
      var type=d.plateMode==='fr'?FR_MASK[Math.min(d.plate.length,6)]:'X';
      var allowed=d.plateMode==='fr'?(type==='L'?FR_LETTERS:DIGITS):ALNUM;
      if(allowed.indexOf(k)>=0&&d.plate.length<max)d.plate.push(k); else return;
    } else return;
    var area=$('#stepArea'); if(area){ e.preventDefault(); stepPlate(area,$('#sheetFoot')); }
  });

  /* =================== INIT =================== */
  setView(state.view);
  recompute(); renderAll();

  (function initDb(){
    var c=window.claude;
    if(!c||!c.use){ state.demo=DEMO; $('#demoChip').hidden=false; recompute(); renderAll(); return; }
    c.use('db').then(function(db){
      if(!db){ state.demo=DEMO; $('#demoChip').hidden=false; recompute(); renderAll(); return; }
      state.db=db;
      db.collection('reports').orderBy('ts','desc').limit(150).onSnapshot(function(snap){
        state.remote=snap.docs.map(function(x){var o=x.data()||{};o.id=x.id;if(!o.plateFmt)o.plateFmt=fmtFr(o.plate);return o;});
        if(!state.remote.length && !state.demo.length){ state.demo=DEMO; $('#demoChip').hidden=false; }
        else if(state.remote.length){ state.demo=[]; $('#demoChip').hidden=true; }
        renderAll();
      },function(err){
        console.warn('db snapshot',err&&err.code);
        if(!state.reports.length){ state.demo=DEMO; $('#demoChip').hidden=false; renderAll(); }
      });
    }).catch(function(){ state.demo=DEMO; $('#demoChip').hidden=false; recompute(); renderAll(); });
  })();
})();
</script>

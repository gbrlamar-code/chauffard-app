<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chauffard</title>
<meta name="description" content="Signaler en quelques taps les automobilistes dangereux — carte des signalements en direct.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">

<!-- Leaflet (carte OpenStreetMap) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
  /* ============ TOKENS ============ */
  :root{
    --backdrop:#EDEAE2; --ground:#F4F2EC; --surface:#FFFFFF; --surface-2:#F7F5EF;
    --ink:#1A1E24; --ink-2:#54606E; --muted:#8A94A2; --line:#E4DFD5; --line-2:#EEEAE1;
    --accent:#D9992A; --accent-ink:#241B03; --accent-soft:#F7ECD3;
    --pending:#E5720C; --pending-soft:#FBE6D2; --danger:#CE3F38; --danger-soft:#F7DDDB; --success:#2E9E63;
    --map-asphalt:#E7E3D9;
    --shadow-1:0 1px 2px rgba(20,22,28,.06), 0 6px 20px rgba(20,22,28,.08);
    --shadow-2:0 -8px 40px rgba(20,22,28,.16);
    --cond:'Barlow Condensed','Arial Narrow',sans-serif;
    --sans:'Barlow','Inter','Segoe UI',system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --backdrop:#0B0E13; --ground:#10141A; --surface:#171C24; --surface-2:#1E242E;
      --ink:#ECEFF4; --ink-2:#AEB9C7; --muted:#6B7686; --line:#28303C; --line-2:#222A34;
      --accent:#F2B845; --accent-ink:#241B03; --accent-soft:#33291140;
      --pending:#FB8B3C; --pending-soft:#3a260f60; --danger:#F0564D; --danger-soft:#3a1a1860; --success:#3DD68C;
      --map-asphalt:#11161E;
      --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
      --shadow-2:0 -8px 44px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --backdrop:#0B0E13; --ground:#10141A; --surface:#171C24; --surface-2:#1E242E;
    --ink:#ECEFF4; --ink-2:#AEB9C7; --muted:#6B7686; --line:#28303C; --line-2:#222A34;
    --accent:#F2B845; --accent-ink:#241B03; --accent-soft:#33291140;
    --pending:#FB8B3C; --pending-soft:#3a260f60; --danger:#F0564D; --danger-soft:#3a1a1860; --success:#3DD68C;
    --map-asphalt:#11161E;
    --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
    --shadow-2:0 -8px 44px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--backdrop);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45}
  img{max-width:100%}
  [hidden]{display:none!important}
  button{font-family:inherit;color:inherit;cursor:pointer}
  h1,h2,h3{margin:0;font-family:var(--cond);font-weight:700;letter-spacing:.01em;text-wrap:balance}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}

  .app{
    max-width:480px;margin:0 auto;min-height:100dvh;height:100dvh;
    display:flex;flex-direction:column;background:var(--ground);
    box-shadow:0 0 0 1px var(--line);overflow:hidden;position:relative;
  }
  @media (min-width:900px){ .app{box-shadow:0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,.14)} }

  .topbar{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:none}
  .brand{display:flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:700;font-size:22px;letter-spacing:.03em;margin-right:auto}
  .brand svg{display:block}
  .icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);flex:none}
  .icon-btn:hover{color:var(--ink);border-color:var(--muted)}
  .ic{width:20px;height:20px;display:block}

  .seg{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:12.5px;padding:6px 11px;border-radius:8px}
  .seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}

  .stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px 4px;flex:none}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:9px 11px;display:flex;flex-direction:column;gap:1px}
  .tile .n{font-family:var(--cond);font-weight:700;font-size:25px;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
  .tile .l{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.02em}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .dot.pending{background:var(--pending)} .dot.danger{background:var(--danger)} .dot.muted{background:var(--muted)}

  .demo-chip{margin:6px 14px 0;font-size:11px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:5px 9px;text-align:center;flex:none}

  .stage{flex:1;min-height:0;padding:10px 14px 12px;display:flex}
  .view{flex:1;min-height:0;width:100%}
  .view.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .view-carte{display:flex;flex-direction:column;gap:10px}

  .mapwrap{position:relative;flex:1;min-height:320px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--map-asphalt);isolation:isolate}
  .map{position:absolute;inset:0}
  .leaflet-container{background:var(--map-asphalt);font:inherit}
  .leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.7)}
  :root[data-theme="dark"] .leaflet-tile,
  :root[data-theme="dark"] .leaflet-control-zoom a{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}
  :root[data-theme="dark"] .leaflet-control-attribution{background:rgba(0,0,0,.55);color:#9aa4af}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .leaflet-tile,
    :root:not([data-theme="light"]) .leaflet-control-zoom a{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}
    :root:not([data-theme="light"]) .leaflet-control-attribution{background:rgba(0,0,0,.55);color:#9aa4af}
  }

  .pin{
    display:block;width:16px;height:16px;border-radius:50%;position:relative;
    border:2.5px solid var(--surface);background:var(--pending);box-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  .pin.red{background:var(--danger)}
  .pin.sel{transform:scale(1.45);box-shadow:0 0 0 4px var(--accent-soft),0 2px 8px rgba(0,0,0,.4);z-index:5}
  .pin.live::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--pending);animation:ping 1.8s ease-out infinite}
  .pin.red.live::after{border-color:var(--danger)}
  @keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.7);opacity:0}}
  .you-dot{width:14px;height:14px;border-radius:50%;background:#2b7fff;border:3px solid #fff;box-shadow:0 0 0 4px rgba(43,127,255,.25)}

  .map-overlay{position:absolute;inset:0;pointer-events:none;z-index:650}
  .legend{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:10.5px;color:var(--ink-2);backdrop-filter:blur(4px)}
  .legend i{display:inline-flex;align-items:center;gap:6px}
  .legend .sw{width:9px;height:9px;border-radius:50%;border:2px solid var(--surface)}
  .time-filter{position:absolute;left:10px;bottom:24px;pointer-events:auto;display:flex;gap:2px;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:10px;padding:3px;backdrop-filter:blur(4px)}
  .time-filter button{border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:11px;padding:5px 8px;border-radius:7px}
  .time-filter button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .map-fab{position:absolute;right:10px;bottom:24px;pointer-events:auto;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--shadow-1)}
  .map-fab:hover{color:var(--ink)}

  .list{display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
  .list-head{font-family:var(--cond);font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:2px}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:36px 20px;border:1px dashed var(--line);border-radius:14px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
  button.card:hover{border-color:var(--muted)}
  .card-top{display:flex;align-items:center;gap:10px}
  .card-count{margin-left:auto;font-family:var(--cond);font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end}
  .card-count small{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.03em}
  .card-count.flag{color:var(--danger)}
  .card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
  .card-meta .v{display:inline-flex;align-items:center;gap:4px}
  .card-meta .v .ic{width:16px;height:16px}
  .sep-dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}

  .mini-chips{display:flex;flex-wrap:wrap;gap:5px}
  .mini-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;background:var(--surface-2);border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;color:var(--ink-2)}
  .mini-chip .ic{width:13px;height:13px}
  .mini-chip b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

  .act-row{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 12px;width:100%;text-align:left}
  button.act-row:hover{border-color:var(--muted)}
  .act-time{font-size:10.5px;color:var(--muted);width:58px;flex:none;line-height:1.25;font-weight:500}
  .act-main{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .act-beh{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act-veh{width:20px;height:20px;color:var(--ink-2);flex:none}

  .plate{display:inline-flex;align-items:stretch;border:1.5px solid #12233a;border-radius:6px;overflow:hidden;background:#fff;color:#0b1b2b;font-family:var(--cond);font-weight:700;letter-spacing:.06em;box-shadow:0 1px 0 rgba(0,0,0,.18);font-size:15px;line-height:1;flex:none}
  .plate .eu{background:#123a8f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 4px}
  .plate .eu svg{display:block}
  .plate .eu b{font-size:.72em;line-height:1}
  .plate .num{padding:4px 9px;display:flex;align-items:center;white-space:nowrap}
  .plate.lg{font-size:27px} .plate.lg .num{padding:6px 12px}
  .plate.sm{font-size:12.5px} .plate.sm .num{padding:3px 7px}

  .cta-bar{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--ground);flex:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:13px;font-weight:600;font-size:14px;padding:12px 16px;width:100%;transition:transform .08s ease, filter .15s ease}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-1)}
  .btn-primary:hover{filter:brightness(1.04)}
  .btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--muted)}
  .btn.big{font-size:15px;padding:14px 16px}
  .btn-report{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--ink);color:var(--ground);border:0;border-radius:14px;font-weight:700;font-size:15px;padding:14px;letter-spacing:.02em;box-shadow:var(--shadow-1)}
  :root[data-theme="dark"] .btn-report{background:var(--accent);color:var(--accent-ink)}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn-report{background:var(--accent);color:var(--accent-ink)} }
  .btn-report:active{transform:translateY(1px)}
  .btn-report .ic{width:20px;height:20px}
  .linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;padding:6px 2px}

  .scrim{position:fixed;inset:0;background:rgba(12,14,20,.5);z-index:1000;opacity:0;transition:opacity .2s}
  .scrim.show{opacity:1}
  .sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;z-index:1001;transform:translateX(-50%) translateY(100%);background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow-2);display:flex;flex-direction:column;max-height:94dvh;transition:transform .26s cubic-bezier(.22,1,.36,1)}
  .sheet.show{transform:translateX(-50%) translateY(0)}
  .sheet-head{display:flex;align-items:center;gap:12px;padding:12px 14px 8px;flex:none}
  .rail{display:flex;gap:5px;flex:1}
  .rail i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .2s}
  .rail i.on{background:var(--accent)}
  .step-count{font-family:var(--cond);font-weight:600;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .sheet-body{padding:6px 18px 8px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .step-title{font-size:26px;margin-bottom:2px}
  .step-sub{color:var(--ink-2);font-size:13px;margin:0 0 16px}
  .sheet-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);flex:none;display:flex;gap:9px}
  .sheet-foot .btn{flex:1}

  .pick-map{height:230px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--map-asphalt);isolation:isolate}
  #dMap.pick-map{height:200px}
  .geo-btn{margin-top:10px}

  .addr-search-wrap{position:relative;margin-bottom:9px}
  .addr-search-wrap>.ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
  .addr-search{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px 11px 34px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
  .addr-search:focus{border-color:var(--accent);outline:none}
  .addr-results{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-1);overflow:hidden;max-height:210px;overflow-y:auto}
  .addr-opt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-2);padding:10px 12px;font-size:12.5px;color:var(--ink);line-height:1.35}
  .addr-opt:last-child{border-bottom:0}
  .addr-opt:hover{background:var(--surface-2)}
  .addr-opt .ic{width:15px;height:15px;color:var(--muted);flex:none}
  .addr-none{padding:10px 12px;font-size:12px;color:var(--muted)}
  .addr-chip{display:flex;align-items:center;gap:8px;margin-top:9px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2);line-height:1.3}
  .addr-chip .ic{width:16px;height:16px;flex:none;color:var(--muted)}
  .addr-chip.set{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
  .addr-chip.set .ic{color:var(--accent)}
  .when-block{margin-top:16px}
  .when-row{display:flex;flex-wrap:wrap;gap:7px}
  .when-chip{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
  .when-chip .ic{width:14px;height:14px}
  .when-chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
  .when-input{margin-top:10px;width:100%;border:1.5px solid var(--accent);border-radius:11px;padding:10px 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);color-scheme:light dark}
  .when-echo{margin-top:8px;font-size:12px;color:var(--muted)}
  .act-addr{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist-row .haddr{display:block;margin-top:2px;color:var(--muted);font-size:11px}
  .detail-addr{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--ink-2);line-height:1.35}
  .detail-addr .ic{width:15px;height:15px;flex:none;color:var(--muted);margin-top:1px}

  .b-group{margin-bottom:14px}
  .b-group h3{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .b-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .b-chip{display:flex;align-items:center;gap:9px;text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 11px;font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.2}
  .b-chip .ic{width:20px;height:20px;color:var(--ink-2);flex:none}
  .b-chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
  .b-chip[aria-pressed="true"] .ic{color:var(--accent)}

  .plate-entry{display:flex;align-items:stretch;border:2px solid #12233a;border-radius:9px;overflow:hidden;background:#fff;margin:4px 0 16px;box-shadow:var(--shadow-1)}
  .plate-entry .eu{background:#123a8f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 8px}
  .plate-entry .eu b{font-size:13px}
  .plate-entry .slots{flex:1;display:flex;align-items:center;justify-content:center;gap:3px;padding:12px 8px}
  .slot{min-width:24px;height:38px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:700;font-size:30px;color:#0b1b2b;border-bottom:3px solid #cdd3da}
  .slot.has{border-bottom-color:#12233a}
  .slot.cur{border-bottom-color:var(--accent);animation:blink 1.1s step-end infinite}
  @keyframes blink{50%{border-bottom-color:#cdd3da}}
  .slots .sep{border:0;color:#9aa3ad;font-size:22px;min-width:8px}
  .pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px}
  .key{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;font-family:var(--cond);font-weight:600;font-size:19px;padding:11px 0;color:var(--ink)}
  .key:hover:not([disabled]){border-color:var(--muted)}
  .key:active{background:var(--accent-soft)}
  .key[disabled]{opacity:.3;pointer-events:none}
  .key-back{background:var(--surface);font-size:17px}
  .pmode-row{text-align:center;margin-top:12px}

  .v-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .v-btn{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:14px 6px 11px;font-weight:600;font-size:12px;color:var(--ink)}
  .v-btn .ic{width:30px;height:30px;color:var(--ink-2)}
  .v-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
  .v-btn[aria-pressed="true"] .ic{color:var(--accent)}

  .recap{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:4px}
  .recap-row{display:flex;align-items:center;gap:10px;padding:12px 13px;background:var(--surface);border-bottom:1px solid var(--line-2)}
  .recap-row:last-child{border-bottom:0}
  .recap-row .rk{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;width:82px;flex:none;line-height:1.25}
  .recap-row .rv{flex:1;font-size:13px;font-weight:600;color:var(--ink);min-width:0}
  .recap-row .rv.wrap{white-space:normal}
  .recap-row .rv .ic{width:18px;height:18px;display:inline-block;vertical-align:-4px;margin-right:4px}
  .recap-row .edit{color:var(--accent);width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;flex:none}
  .recap-row .edit .ic{width:15px;height:15px}

  .done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:14px 4px 6px}
  .done .badge-ic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;flex:none}
  .done .badge-ic .ic{width:32px;height:32px}
  .done.ok .badge-ic{background:color-mix(in srgb,var(--success) 18%,transparent);color:var(--success)}
  .done.flag .badge-ic{background:var(--danger-soft);color:var(--danger)}
  .done h2{font-size:24px}
  .done p{color:var(--ink-2);font-size:13px;margin:0;max-width:34ch}
  .done .plate{margin:2px 0}
  .notify{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px;text-align:left}
  .notify-head{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px}
  .notify-head .ic{width:19px;height:19px;color:var(--accent)}
  .switch{margin-left:auto;width:44px;height:26px;border-radius:999px;background:var(--line);border:0;padding:2px;flex:none;transition:background .16s}
  .switch span{display:block;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .16s}
  .switch[aria-checked="true"]{background:var(--success)}
  .switch[aria-checked="true"] span{transform:translateX(18px)}
  .notify-body{display:none;flex-direction:column;gap:8px}
  .notify-body.open{display:flex}
  .notify input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
  .notify input:focus{border-color:var(--accent);outline:none}
  .notify .hint{font-size:11px;color:var(--muted)}
  .notify.saved{border-color:var(--success)}
  .notify .saved-line{display:flex;align-items:center;gap:7px;color:var(--success);font-weight:600;font-size:13px}
  .notify .saved-line .ic{width:17px;height:17px}

  .detail-status{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:12.5px;border-radius:999px;padding:5px 11px}
  .detail-status.flag{background:var(--danger-soft);color:var(--danger)}
  .detail-status.one{background:var(--pending-soft);color:var(--pending)}
  .detail-head{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-bottom:14px}
  .hist{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-top:6px}
  .hist-row{display:flex;gap:10px;padding:11px 12px;background:var(--surface);border-bottom:1px solid var(--line-2);align-items:flex-start}
  .hist-row:last-child{border-bottom:0}
  .hist-row .ht{font-size:10.5px;color:var(--muted);width:56px;flex:none;font-weight:500;padding-top:1px}
  .hist-row .hb{flex:1;font-size:12px;color:var(--ink-2);line-height:1.4}
  .hist-row .hv{width:18px;height:18px;color:var(--ink-2);flex:none}
  .sub-label{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}

  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--ground);font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:11px;z-index:1200;box-shadow:var(--shadow-1);opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .info-body p{font-size:13px;color:var(--ink-2);margin:0 0 11px}
  .info-body p b{color:var(--ink)}

  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001s!important;transition-duration:.001s!important} }
</style>
</head>

<script>

  var FR_LETTERS="ABCDEFGHJKLMNPQRSTVWXYZ".split('');

  function fmtFr(raw){
    if(!raw)return '';
    if(/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(raw))return raw.slice(0,2)+'-'+raw.slice(2,5)+'-'+raw.slice(5,7);

    var h=m/60; if(h<24)return "il y a "+Math.floor(h)+" h";
    var d=h/24; if(d<2)return "hier";
    if(d<7)return "il y a "+Math.floor(d)+" j";
    return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  }

  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

  /* ---- Géocodage : recherche d'adresse + adresse d'un point ----
     Photon (Komoot) : libre, sans clé, CORS ouvert, pensé pour l'autocomplétion.

       search  : https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=fr&q=<q>
       reverse : https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=<lat>&lon=<lng>
     (Nominatim limite à 1 req/s et déconseille l'autocomplétion — préférer Photon ici.) */
  function placeLabel(p){
    if(!p)return '';
    var l1=[p.housenumber,p.street||p.name].filter(Boolean).join(' ');
    var l2=[p.postcode,p.city||p.county||p.state].filter(Boolean).join(' ');
    return [l1,l2].filter(Boolean).join(', ') || p.name || (p.city||'');
  }
  function geocodeSearch(q){
    var u='https://photon.komoot.io/api/?lang=fr&limit=5&lat='+HOME.center[0]+'&lon='+HOME.center[1]+'&q='+encodeURIComponent(q);
    return fetch(u).then(function(r){return r.json();}).then(function(j){
      return (j.features||[]).map(function(f){
        return {label:placeLabel(f.properties),lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]};
      }).filter(function(p){return p.label;});
    });
  }
  function geocodeReverse(lat,lng){
    var u='https://photon.komoot.io/reverse/?lang=fr&lat='+lat+'&lon='+lng;
    return fetch(u).then(function(r){return r.json();}).then(function(j){
      return placeLabel(((j.features||[])[0]||{}).properties)||null;
    });
  }

    D('RD902MC','bus',['queue'],48.8779,2.2827,3.6*1440,'Porte Maillot, 75017 Paris'),
    D('PL228DR','camion',['tel'],48.8399,2.3823,4.5*1440,'Quai de Bercy, 75012 Paris')
  ];

  /* =================== STORAGE ADAPTERS =================== */
  // Interface commune : subscribeReports(cb)->unsub, addReport(rec)->Promise,
  //                     getPlate(id)->Promise<obj|null>, setPlate(id,data)->Promise

  function storageOK(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } }
  function LocalStore(){
    this.key='chauffard_reports_v1'; this.pkey='chauffard_plates_v1'; this.isShared=false;
    this.ok=storageOK(); this._mem=null; this._pmem={};   // repli en mémoire si localStorage indisponible
  }
  LocalStore.prototype._read=function(){
    if(!this.ok)return this._mem?this._mem.slice():[];
    try{return JSON.parse(localStorage.getItem(this.key)||'[]');}catch(e){return [];}
  };
  LocalStore.prototype._write=function(a){
    if(!this.ok){ this._mem=a.slice(); return; }
    try{localStorage.setItem(this.key,JSON.stringify(a));}catch(e){ this.ok=false; this._mem=a.slice(); }
  };
  LocalStore.prototype._notify=function(){ if(this._cb)this._cb(this._read()); };
  LocalStore.prototype.subscribeReports=function(cb){
    var self=this; this._cb=cb; cb(this._read());
    this._onStorage=function(e){ if(!e||e.key===self.key)self._notify(); };
    window.addEventListener('storage',this._onStorage);
    return function(){ window.removeEventListener('storage',self._onStorage); };
  };
  LocalStore.prototype.addReport=function(rec){ var a=this._read(); a.unshift(rec); this._write(a); this._notify(); return Promise.resolve(); };
  LocalStore.prototype._plates=function(){
    if(!this.ok)return this._pmem;
    try{return JSON.parse(localStorage.getItem(this.pkey)||'{}');}catch(e){return {};}
  };
  LocalStore.prototype.getPlate=function(p){ return Promise.resolve(this._plates()[p]||null); };
  LocalStore.prototype.setPlate=function(p,data){
    var m=this._plates(); m[p]=data;
    if(this.ok){ try{localStorage.setItem(this.pkey,JSON.stringify(m));}catch(e){ this.ok=false; this._pmem=m; } }
    else this._pmem=m;
    return Promise.resolve();
  };
  LocalStore.prototype.reset=function(){
    this._write(DEMO.slice());
    if(this.ok){ try{localStorage.removeItem(this.pkey);}catch(e){} } else this._pmem={};
    this._notify();
  };

  function FirebaseStore(cfg){
    firebase.initializeApp(cfg);
    this.db=firebase.firestore();
    this.isShared=true;
  }
  FirebaseStore.prototype.subscribeReports=function(cb){
    return this.db.collection('reports').orderBy('ts','desc').limit(200).onSnapshot(function(snap){
      cb(snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o;}));
    },function(err){ console.warn('Firestore:',err&&err.code); });
  };
  FirebaseStore.prototype.addReport=function(rec){ return this.db.collection('reports').doc(rec.id).set(rec); };
  FirebaseStore.prototype.getPlate=function(p){ return this.db.collection('plates').doc(p).get().then(function(s){return s.exists?s.data():null;}); };
  FirebaseStore.prototype.setPlate=function(p,data){ return this.db.collection('plates').doc(p).set(data); };

  function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=function(){rej(new Error(src));}; document.head.appendChild(s); }); }
  function makeStore(){
    if(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey){
      return loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js')
        .then(function(){return loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');})
        .then(function(){return new FirebaseStore(FIREBASE_CONFIG);})
        .catch(function(e){ console.warn('Firebase indisponible, bascule en local.',e); return localFallback(); });
    }
    return Promise.resolve(localFallback());
  }
  function localFallback(){
    var ls=new LocalStore();
    // Aucun stockage partagé configuré : on amorce avec des exemples tant que
    // rien de réel n'a été saisi (le bouton « Réinitialiser » les remet).
    try{ if(ls._read().length===0) ls._write(DEMO.slice()); }catch(e){}
    return ls;
  }

  /* =================== STATE =================== */
  var state={
    store:null, unsub:null,
    view:lsGet('chauffard_view')||'carte',
    filter:lsGet('chauffard_filter')||'7j',
    reporterId:lsGet('chauffard_reporter')||(function(){var v=uid();lsSet('chauffard_reporter',v);return v;})(),
    remote:[], reports:[], stats:new Map(),
    selectedPlate:null, sheetMode:null, sheetReturn:null, sheetMap:null, draft:null
  };

  /* =================== MAP =================== */
  var map=null, pinLayer=null, youMarker=null;
  function tileLayer(){ return L.tileLayer(TILE_URL,{attribution:TILE_ATTR,subdomains:TILE_SUBDOMAINS,maxZoom:19}); }
  function pinIcon(kind,live,sel){
    return L.divIcon({className:'',iconSize:[16,16],iconAnchor:[8,8],
      html:'<span class="pin'+(kind==='red'?' red':'')+(live?' live':'')+(sel?' sel':'')+'"></span>'});
  }
  function initMap(){
    map=L.map('map',{zoomControl:true,minZoom:HOME.minZoom,
      maxBounds:L.latLngBounds(HOME.bounds),maxBoundsViscosity:.7})
      .setView(HOME.center,HOME.zoom);
    tileLayer().addTo(map);
    pinLayer=L.layerGroup().addTo(map);
  }
  function renderPins(){
    if(!pinLayer)return;
    pinLayer.clearLayers();
    var now=Date.now(), span=FILTERS[state.filter];
    state.reports.forEach(function(rp){
      if(rp.lat==null||rp.lng==null)return;
      var w=whenOf(rp);
      if(span!==Infinity && now-w>span)return;
      var e=state.stats.get(rp.plate)||{count:1};
      var mk=L.marker([rp.lat,rp.lng],{
        icon:pinIcon(e.count>=2?'red':'amber', now-w<2*H, state.selectedPlate===rp.plate),
        keyboard:false
      });
      mk.on('click',function(){ openDetail(rp.plate); });
      mk.addTo(pinLayer);
    });
  }
  function locateMe(){
    if(!navigator.geolocation){toast('Géolocalisation indisponible');return;}
    navigator.geolocation.getCurrentPosition(function(pos){
      var ll=[pos.coords.latitude,pos.coords.longitude];
      map.setView(ll,15);
      if(youMarker)youMarker.setLatLng(ll);
      else youMarker=L.marker(ll,{icon:L.divIcon({className:'',iconSize:[14,14],iconAnchor:[7,7],html:'<span class="you-dot"></span>'})}).addTo(map);
    },function(){ toast('Position indisponible'); },{timeout:8000,maximumAge:60000});
  }
  function killSheetMap(){ if(state.sheetMap){ try{state.sheetMap.remove();}catch(e){} state.sheetMap=null; } }

  /* =================== RECOMPUTE =================== */
  function recompute(){
    state.reports=state.remote.slice().sort(function(a,b){return whenOf(b)-whenOf(a);});
    var m=new Map();
    state.reports.forEach(function(rp){
      var e=m.get(rp.plate), w=whenOf(rp);
      if(!e){e={plate:rp.plate,plateFmt:rp.plateFmt||fmtFr(rp.plate),count:0,vehicle:rp.vehicle,lastTs:w,firstTs:w,behaviors:{},lat:rp.lat,lng:rp.lng,reports:[]};m.set(rp.plate,e);}
      e.count++; e.reports.push(rp);
      e.lastTs=Math.max(e.lastTs,w); e.firstTs=Math.min(e.firstTs,w);
      (rp.behaviors||[]).forEach(function(b){e.behaviors[b]=(e.behaviors[b]||0)+1;});
    });
    state.stats=m;
  }
  function topBehaviors(e,n){
    return Object.keys(e.behaviors).sort(function(a,b){return e.behaviors[b]-e.behaviors[a];}).slice(0,n||3);
  }

  /* =================== RENDER =================== */
  function renderStatStrip(){
    var strip=$('#statStrip');
    if(state.view!=='carte'){strip.hidden=true;return;}
    strip.hidden=false;
    var now=Date.now();
    var live=state.reports.filter(function(x){return now-whenOf(x)<2*H;}).length;
    var flagged=0; state.stats.forEach(function(e){if(e.count>=2)flagged++;});
    var wk=state.reports.filter(function(x){return now-whenOf(x)<7*DAY;}).length;
    strip.innerHTML=tile(live,'en direct','pending')+tile(flagged,'chauffards','danger')+tile(wk,'sur 7 jours','muted');
  }
  function tile(n,label,tone){ return '<div class="tile"><span class="n"><span class="dot '+tone+'"></span>'+n+'</span><span class="l">'+label+'</span></div>'; }

  function plateBadge(fmt,size){
    return '<span class="plate'+(size?' '+size:'')+'"><span class="eu">'+EU_STARS+'<b>F</b></span><span class="num">'+esc(fmt||'—')+'</span></span>';
  }

  function renderChauffards(){
    var box=$('#chauffardList');
    var arr=[]; state.stats.forEach(function(e){if(e.count>=2)arr.push(e);});
    arr.sort(function(a,b){return b.count-a.count||b.lastTs-a.lastTs;});
    if(!arr.length){box.innerHTML='<div class="empty">Aucun chauffard pour l’instant.<br>Une plaque signalée 2 fois apparaît ici.</div>';return;}
    box.innerHTML='<div class="list-head">'+arr.length+' véhicule'+(arr.length>1?'s':'')+' signalé'+(arr.length>1?'s':'')+' plusieurs fois</div>'+
      arr.map(function(e){
        var beh=topBehaviors(e,3).map(function(b){return '<span class="mini-chip">'+ic(b)+BLABEL[b]+' <b>'+e.behaviors[b]+'</b></span>';}).join('');
        return '<button class="card" data-plate="'+esc(e.plate)+'">'+
          '<div class="card-top">'+plateBadge(e.plateFmt)+'<span class="card-count flag">×'+e.count+'<small>signalements</small></span></div>'+
          '<div class="card-meta"><span class="v">'+ic(e.vehicle)+VLABEL[e.vehicle]+'</span><span class="sep-dot"></span><span>vu '+ago(e.lastTs)+'</span></div>'+
          '<div class="mini-chips">'+beh+'</div></button>';
      }).join('');
  }
  function renderActivite(){
    var box=$('#activiteList');
    if(!state.reports.length){box.innerHTML='<div class="empty">Aucun signalement enregistré.</div>';return;}
    box.innerHTML='<div class="list-head">Derniers signalements</div>'+
      state.reports.slice(0,60).map(function(rp){
        var e=state.stats.get(rp.plate)||{count:1};
        var labels=(rp.behaviors||[]).map(function(b){return BLABEL[b];});
        var behTxt=labels.slice(0,2).join(', ')+(labels.length>2?' +'+(labels.length-2):'');
        return '<button class="act-row" data-plate="'+esc(rp.plate)+'">'+
          '<span class="act-time">'+ago(whenOf(rp))+'</span>'+
          '<span class="act-main">'+plateBadge(rp.plateFmt||fmtFr(rp.plate),'sm')+'<span class="act-beh">'+esc(behTxt)+'</span>'+
            (rp.address?'<span class="act-addr">'+esc(rp.address)+'</span>':'')+'</span>'+
          (e.count>=2?'<span class="mini-chip" style="color:var(--danger)">×'+e.count+'</span>':'')+
          ic(rp.vehicle,'act-veh')+'</button>';
      }).join('');
  }

  function renderAll(){
    if(state.remote)recompute();
    renderStatStrip(); renderPins(); renderChauffards(); renderActivite();
    if(state.sheetMode==='detail'&&state.selectedPlate)openDetail(state.selectedPlate,true);
  }

  function setView(v){
    state.view=v; lsSet('chauffard_view',v);
    ['carte','chauffards','activite'].forEach(function(name){ $('#view-'+name).hidden=(name!==v); });
    Array.prototype.forEach.call(document.querySelectorAll('#seg button'),function(b){ b.setAttribute('aria-selected',String(b.dataset.view===v)); });
    renderStatStrip();
    if(v==='carte'&&map)setTimeout(function(){ map.invalidateSize(); },60);
  }

  /* =================== SHEET =================== */
  function openSheet(){
    state.sheetReturn=document.activeElement;
    var sc=$('#scrim'), sh=$('#sheet');
    sc.hidden=false; sh.hidden=false;
    requestAnimationFrame(function(){ sc.classList.add('show'); sh.classList.add('show'); });
    document.addEventListener('keydown',onSheetKey);
  }
  function closeSheet(){
    killSheetMap();
    var sc=$('#scrim'), sh=$('#sheet');
    sc.classList.remove('show'); sh.classList.remove('show');
    document.removeEventListener('keydown',onSheetKey);
    setTimeout(function(){ sc.hidden=true; sh.hidden=true; sh.innerHTML=''; },260);
    state.sheetMode=null; state.draft=null;
    if(state.sheetReturn&&state.sheetReturn.focus)try{state.sheetReturn.focus();}catch(e){}
  }
  function onSheetKey(e){ if(e.key==='Escape')closeSheet(); }
  $('#scrim').addEventListener('click',closeSheet);

  var toastT;
  function toast(msg){
    var t=$('#toast'); t.textContent=msg; t.hidden=false;
    requestAnimationFrame(function(){ t.classList.add('show'); });
    clearTimeout(toastT);
    toastT=setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){t.hidden=true;},200); },2200);
  }

  /* =================== DETAIL =================== */
  function openDetail(plate,keep){
    var e=state.stats.get(plate); if(!e)return;
    killSheetMap();
    state.sheetMode='detail'; state.selectedPlate=plate; renderPins();
    var flagged=e.count>=2;
    var scrollTop=keep?(($('#sheetBody')||{}).scrollTop||0):0;
    var beh=topBehaviors(e,6).map(function(b){return '<span class="mini-chip">'+ic(b)+BLABEL[b]+' <b>'+e.behaviors[b]+'</b></span>';}).join('');
    var sorted=e.reports.slice().sort(function(a,b){return whenOf(b)-whenOf(a);});
    var lastAddr=(sorted[0]||{}).address;
    var hist=sorted.map(function(rp){
      return '<div class="hist-row"><span class="ht">'+ago(whenOf(rp))+'</span><span class="hb">'+(rp.behaviors||[]).map(function(b){return BLABEL[b];}).join(' · ')+
        (rp.address?'<span class="haddr">'+esc(rp.address)+'</span>':'')+'</span>'+ic(rp.vehicle,'hv')+'</div>';
    }).join('');
    var sh=$('#sheet');
    sh.innerHTML=
      '<div class="sheet-head"><button class="icon-btn" id="dClose" aria-label="Fermer">'+ic('close')+'</button><div class="rail"></div></div>'+
      '<div class="sheet-body" id="sheetBody">'+
        '<div class="detail-head">'+plateBadge(e.plateFmt,'lg')+
          '<span class="detail-status '+(flagged?'flag':'one')+'">'+(flagged?ic('menace'):ic('location'))+(flagged?('Chauffard — '+e.count+' signalements'):'1 signalement')+'</span>'+
          '<div class="card-meta"><span class="v">'+ic(e.vehicle)+VLABEL[e.vehicle]+'</span><span class="sep-dot"></span><span>dernier '+ago(e.lastTs)+'</span></div>'+
          (lastAddr?'<div class="detail-addr">'+ic('location')+'<span>'+esc(lastAddr)+'</span></div>':'')+
        '</div>'+
        '<div class="pick-map" id="dMap"></div>'+
        '<div class="sub-label">Ce qui est reproché</div><div class="mini-chips">'+beh+'</div>'+
        '<div class="sub-label">Historique</div><div class="hist">'+hist+'</div>'+
        (flagged?('<div class="notify" id="dNotify"><div class="notify-head">'+ic('bell')+'M’alerter au prochain signalement'+
          '<button class="switch" id="dSwitch" role="switch" aria-checked="false"><span></span></button></div>'+
          '<div class="notify-body" id="dNotifyBody"><input type="email" id="dEmail" placeholder="votre@email.fr" autocomplete="email" inputmode="email">'+
          '<button class="btn btn-primary" id="dSaveEmail">Activer l’alerte</button>'+
          '<span class="hint">Enregistré'+(state.store&&state.store.isShared?'':' sur cet appareil')+'. L’envoi d’e-mail réel nécessite un service de messagerie ; en attendant, l’alerte s’affiche ici.</span></div></div>'):'')+
      '</div>'+
      '<div class="sheet-foot"><button class="btn btn-primary" id="dReport">'+ic('menace')+' Signaler ce véhicule</button></div>';
    if(!$('#scrim').classList.contains('show'))openSheet();
    $('#sheetBody').scrollTop=scrollTop;
    $('#dClose').onclick=closeSheet;
    $('#dReport').onclick=function(){ openReport({plate:e.plate,plateFmt:e.plateFmt,vehicle:e.vehicle}); };
    if(flagged)wireNotify($('#dSwitch'),$('#dNotifyBody'),$('#dEmail'),$('#dSaveEmail'),$('#dNotify'),e.plate,e.plateFmt);
    var dm=L.map('dMap',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false});
    tileLayer().addTo(dm);
    var pts=e.reports.filter(function(r){return r.lat!=null;}).map(function(r){
      L.marker([r.lat,r.lng],{icon:pinIcon(flagged?'red':'amber',false,false),keyboard:false}).addTo(dm);
      return [r.lat,r.lng];
    });
    if(pts.length>1)dm.fitBounds(L.latLngBounds(pts).pad(.4));
    else if(pts.length)dm.setView(pts[0],14);
    else dm.setView(HOME.center,12);
    state.sheetMap=dm;
    setTimeout(function(){ dm.invalidateSize(); },260);
  }

  function wireNotify(sw,body,input,saveBtn,box,plate,plateFmt){
    sw.onclick=function(){
      var on=sw.getAttribute('aria-checked')!=='true';
      sw.setAttribute('aria-checked',String(on));
      body.classList.toggle('open',on);
      if(on)setTimeout(function(){input.focus();},60);
    };
    saveBtn.onclick=function(){
      var v=(input.value||'').trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast('E-mail non valide');return;}
      saveWatcher(plate,plateFmt,v).then(function(){
        box.classList.add('saved');
        body.innerHTML='<span class="saved-line">'+ic('check')+'Alerte activée pour '+esc(plateFmt)+'</span>'+
          '<span class="hint">La plaque reste marquée en rouge. Vous verrez une alerte au prochain signalement.</span>';
      }).catch(function(){ toast('Enregistrement impossible'); });
    };
  }
  function saveWatcher(plate,plateFmt,email){
    if(!state.store)return Promise.resolve();
    return state.store.getPlate(plate).then(function(cur){
      var w=(cur&&cur.watchers)?cur.watchers.slice():[];
      if(w.indexOf(email)<0)w.push(email);
      return state.store.setPlate(plate,{plate:plate,plateFmt:plateFmt,watchers:w,updated:Date.now()});
    });
  }

  /* =================== REPORT FLOW =================== */
  function openReport(prefill){
    killSheetMap();
    state.sheetMode='report';
    state.draft={step:1,loc:null,address:null,when:Date.now(),whenSource:'now',behaviors:[],plate:[],plateMode:'fr',plateNorm:'',plateFmt:'',vehicle:null,_prev:0};
    if(prefill&&prefill.plate){
      state.draft.plate=prefill.plate.split('');
      state.draft.plateNorm=prefill.plate;
      state.draft.plateFmt=prefill.plateFmt||fmtFr(prefill.plate);

    }

  function renderStep(){
    var d=state.draft, sh=$('#sheet');
    killSheetMap();
    if(d.step>=6){renderDone();return;}
    var T={
      1:['Où et quand ?','Cherchez l’adresse de l’incident, puis indiquez quand.'],
      2:['Qu’a-t-il fait ?','Choisissez tout ce qui s’applique — pas besoin d’écrire.'],
      3:['Sa plaque','Composez la plaque touche par touche.'],
      4:['Quel véhicule ?','Un seul choix.'],
      5:['On vérifie','Un détail à corriger ?']
    }[d.step];
    sh.innerHTML=
      '<div class="sheet-head">'+
        '<button class="icon-btn" id="stepBack" aria-label="'+(d.step===1?'Fermer':'Retour')+'">'+ic(d.step===1?'close':'back')+'</button>'+
        '<div class="rail" aria-hidden="true">'+[1,2,3,4,5].map(function(n){return '<i class="'+(n<=d.step?'on':'')+'"></i>';}).join('')+'</div>'+
        '<span class="step-count">'+d.step+'/5</span>'+
      '</div>'+
      '<div class="sheet-body" id="sheetBody">'+
        '<h2 id="sheetTitle" class="step-title">'+T[0]+'</h2><p class="step-sub">'+T[1]+'</p>'+
        '<div id="stepArea"></div>'+
      '</div>'+
      '<div class="sheet-foot" id="sheetFoot"></div>';
    ({1:stepLoc,2:stepWhat,3:stepPlate,4:stepVehicle,5:stepRecap})[d.step]($('#stepArea'),$('#sheetFoot'));
    $('#stepBack').onclick=function(){ if(d.step===1)closeSheet(); else {d.step--;renderStep();} };
  }
  function nextBtn(label,onClick,disabled){

  function stepLoc(area,foot){
    var d=state.draft;
    area.innerHTML=
      '<div class="addr-search-wrap">'+ic('search')+
        '<input type="text" class="addr-search" id="addrSearch" placeholder="Adresse ou lieu de l’incident…" autocomplete="off" autocapitalize="off" spellcheck="false">'+
        '<div class="addr-results" id="addrResults" hidden></div>'+
      '</div>'+
      '<div class="addr-chip" id="addrChip">'+ic('location')+'<span id="addrChipTxt">Aucune adresse choisie</span></div>'+
      '<button class="btn btn-ghost geo-btn" id="geoBtn">'+ic('crosshair')+' Utiliser ma position</button>'+
      '<div class="when-block">'+
        '<div class="sub-label">Quand ?</div>'+
        '<div class="when-row" id="whenRow">'+
          '<button class="when-chip" data-off="0" aria-pressed="true">Maintenant</button>'+
          '<button class="when-chip" data-off="1">Il y a 1 h</button>'+
          '<button class="when-chip" data-off="3">Il y a 3 h</button>'+
          '<button class="when-chip" data-pick="1">'+ic('clock')+' Date précise</button>'+
        '</div>'+
        '<input type="datetime-local" class="when-input" id="whenInput" hidden>'+
        '<div class="when-echo" id="whenEcho"></div>'+
      '</div>';
    var next=nextBtn('Continuer',function(){d.step=2;renderStep();},true);
    foot.appendChild(next);

    var sInput=$('#addrSearch'), sBox=$('#addrResults'), sT, revSeq=0;
    function updateNext(){ next.disabled=!(d.loc&&d.address); }
    function paintAddr(pending){
      var t=$('#addrChipTxt'), chip=$('#addrChip');
      if(d.address){ t.textContent=d.address; chip.classList.add('set'); }
      else if(pending){ t.textContent='Recherche de l’adresse…'; chip.classList.remove('set'); }
      else { t.textContent='Aucune adresse choisie'; chip.classList.remove('set'); }
      updateNext();
    }
    function setPlace(lat,lng,src,label){
      d.loc={lat:lat,lng:lng,src:src||'search'};
      if(label!=null){ d.address=label; paintAddr(); return; }
      d.address=null; paintAddr(true);
      var my=++revSeq;
      geocodeReverse(lat,lng).then(function(l){
        if(my!==revSeq)return;
        d.address=l||('Position GPS · '+lat.toFixed(4)+', '+lng.toFixed(4));
        if(sInput)sInput.value=d.address;
        paintAddr();
      }).catch(function(){
        if(my!==revSeq)return;
        d.address='Position GPS · '+lat.toFixed(4)+', '+lng.toFixed(4);
        if(sInput)sInput.value=d.address; paintAddr();
      });
    }

    /* état repris si retour depuis l'étape suivante */
    if(d.loc&&d.address){ sInput.value=d.address; }
    paintAddr();
    setTimeout(function(){ try{ sInput.focus(); }catch(e){} },120);

    /* ---- recherche d'adresse ---- */
    sInput.addEventListener('input',function(){
      var q=sInput.value.trim();
      clearTimeout(sT);
      if(q.length<3){ sBox.hidden=true; sBox.innerHTML=''; return; }
      sT=setTimeout(function(){
        geocodeSearch(q).then(function(list){
          if(!list.length){ sBox.innerHTML='<div class="addr-none">Aucun résultat</div>'; sBox.hidden=false; return; }
          sBox._list=list;
          sBox.innerHTML=list.map(function(p,i){ return '<button class="addr-opt" data-i="'+i+'">'+ic('location')+'<span>'+esc(p.label)+'</span></button>'; }).join('');
          sBox.hidden=false;
        }).catch(function(){ sBox.innerHTML='<div class="addr-none">Recherche indisponible</div>'; sBox.hidden=false; });
      },450);
    });
    sBox.addEventListener('click',function(e){
      var b=e.target.closest('.addr-opt'); if(!b||!sBox._list)return;
      var p=sBox._list[+b.dataset.i];
      setPlace(p.lat,p.lng,'search',p.label);
      sInput.value=p.label; sBox.hidden=true;
    });

    /* ---- position GPS ---- */
    $('#geoBtn').onclick=function(){
      if(!navigator.geolocation){toast('Géolocalisation indisponible');return;}
      $('#geoBtn').textContent='Localisation…';
      navigator.geolocation.getCurrentPosition(function(pos){
        setPlace(pos.coords.latitude,pos.coords.longitude,'gps');
        $('#geoBtn').innerHTML=ic('check')+' Position ajoutée';
      },function(){
        $('#geoBtn').innerHTML=ic('crosshair')+' Utiliser ma position';
        toast('Position refusée — saisissez l’adresse');
      },{timeout:8000,maximumAge:60000});
    };

    /* ---- date / heure ---- */
    var wRow=$('#whenRow'), wInput=$('#whenInput'), wEcho=$('#whenEcho');
    wInput.max=toLocalInput(Date.now());
    function markChip(pred){ Array.prototype.forEach.call(wRow.querySelectorAll('button'),function(x){ x.setAttribute('aria-pressed',String(pred(x))); }); }
    function paintWhen(){
      if(d.whenSource==='custom') wEcho.textContent='Le '+new Date(d.when).toLocaleString('fr-FR',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
      else if(d.whenSource==='now') wEcho.textContent='';
      else wEcho.textContent=ago(d.when);
    }
    wRow.addEventListener('click',function(e){
      var b=e.target.closest('button'); if(!b)return;
      if(b.dataset.pick){
        wInput.hidden=!wInput.hidden;
        if(!wInput.hidden){ wInput.value=toLocalInput(d.when); markChip(function(x){return !!x.dataset.pick;});
          try{ wInput.focus(); if(wInput.showPicker)wInput.showPicker(); }catch(_){} }
        return;
      }
      var off=+b.dataset.off;
      d.when=Date.now()-off*3600e3; d.whenSource=off?('h'+off):'now';
      wInput.hidden=true; markChip(function(x){return x===b;});
      paintWhen();
    });
    wInput.addEventListener('change',function(){
      d.when=Math.min(fromLocalInput(wInput.value),Date.now()); d.whenSource='custom';
      markChip(function(x){return !!x.dataset.pick;});
      paintWhen();
    });
    paintWhen();
  }

  function stepWhat(area,foot){
    var d=state.draft;
    area.innerHTML=BEHAVIORS.map(function(gr){
      return '<div class="b-group"><h3>'+gr.g+'</h3><div class="b-grid">'+
        gr.items.map(function(it){
          var on=d.behaviors.indexOf(it.id)>=0;
          return '<button class="b-chip" data-id="'+it.id+'" aria-pressed="'+on+'">'+ic(it.id)+'<span>'+it.l+'</span></button>';
        }).join('')+'</div></div>';
    }).join('');
    var next=nextBtn('Continuer',function(){d.step=3;renderStep();},d.behaviors.length===0);
    foot.appendChild(next);
    area.addEventListener('click',function(e){
      var b=e.target.closest('.b-chip'); if(!b)return;
      var id=b.dataset.id, i=d.behaviors.indexOf(id);
      if(i>=0)d.behaviors.splice(i,1); else d.behaviors.push(id);
      b.setAttribute('aria-pressed',String(i<0));
      next.disabled=d.behaviors.length===0;
      next.textContent=d.behaviors.length?('Continuer ('+d.behaviors.length+')'):'Continuer';
      if(navigator.vibrate)navigator.vibrate(6);
    });
  }

  function plateInfo(d){
    var raw=d.plate.join('');
    if(d.plateMode==='fr'){
      var ok=/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(raw);
      var fmt=raw.length?(raw.slice(0,2)+(raw.length>2?'-':'')+raw.slice(2,5)+(raw.length>5?'-':'')+raw.slice(5,7)):'';
      return {raw:raw,ok:ok,fmt:fmt};
    }
    return {raw:raw,ok:raw.length>=4,fmt:raw};
  }
  function stepPlate(area,foot){
    var d=state.draft;
    foot.innerHTML='';
    area.innerHTML=
      '<div class="plate-entry"><span class="eu">'+EU_STARS+'<b>F</b></span><span class="slots" id="peSlots"></span></div>'+
      '<div class="pad" id="pad"></div>'+
      '<div class="pmode-row"><button class="linkbtn" id="pmode"></button></div>';
    foot.appendChild(nextBtn('Continuer',function(){
      var i=plateInfo(d); d.plateNorm=i.raw; d.plateFmt=i.fmt||i.raw; d.step=4; renderStep();
    },true));
    var next=foot.querySelector('.btn');
    function paint(){
      var info=plateInfo(d);
      var mask=d.plateMode==='fr'?FR_MASK:['X','X','X','X','X','X','X','X','X'];
      var cur=d.plate.length, slotsHtml='';
      mask.forEach(function(m,idx){
        if(d.plateMode==='fr'&&(idx===2||idx===5))slotsHtml+='<span class="sep">–</span>';
        var ch=d.plate[idx]||'';
        slotsHtml+='<span class="slot'+(ch?' has':'')+(idx===cur?' cur':'')+'">'+ch+'</span>';
      });
      $('#peSlots').innerHTML=slotsHtml;
      var max=d.plateMode==='fr'?7:9;
      var type=d.plateMode==='fr'?mask[Math.min(cur,6)]:'X';
      var keys=d.plateMode==='fr'?(type==='L'?FR_LETTERS:DIGITS):ALNUM;
      var padHtml=keys.map(function(k){return '<button class="key" data-k="'+k+'"'+(cur>=max?' disabled':'')+'>'+k+'</button>';}).join('');
      padHtml+='<button class="key key-back" data-k="__back" aria-label="Effacer">⌫</button>';
      $('#pad').innerHTML=padHtml;
      $('#pmode').textContent=d.plateMode==='fr'?'Plaque étrangère ou ancien format':'Revenir au format français';
      next.disabled=!info.ok;
    }
    $('#pad').addEventListener('click',function(e){
      var b=e.target.closest('.key'); if(!b)return;
      var k=b.dataset.k, max=d.plateMode==='fr'?7:9;
      if(k==='__back')d.plate.pop();
      else if(d.plate.length<max)d.plate.push(k);
      if(navigator.vibrate)navigator.vibrate(5);
      paint();
    });
    $('#pmode').onclick=function(){ d.plateMode=d.plateMode==='fr'?'autre':'fr'; d.plate=[]; paint(); };
    paint();
  }

  function stepVehicle(area,foot){
    var d=state.draft;
    area.innerHTML='<div class="v-grid">'+VEHICLES.map(function(v){
      return '<button class="v-btn" data-v="'+v[0]+'" aria-pressed="'+(d.vehicle===v[0])+'">'+ic(v[0])+'<span>'+v[1]+'</span></button>';
    }).join('')+'</div>';
    var next=nextBtn('Continuer',function(){d.step=5;renderStep();},!d.vehicle);
    foot.appendChild(next);
    area.addEventListener('click',function(e){
      var b=e.target.closest('.v-btn'); if(!b)return;
      d.vehicle=b.dataset.v;
      Array.prototype.forEach.call(area.querySelectorAll('.v-btn'),function(x){x.setAttribute('aria-pressed',String(x.dataset.v===d.vehicle));});
      next.disabled=false;
      if(navigator.vibrate)navigator.vibrate(6);
    });
  }

  function stepRecap(area,foot){
    var d=state.draft, info=plateInfo(d);
    function row(k,vHtml,step,wrap){
      return '<div class="recap-row"><span class="rk">'+k+'</span><span class="rv'+(wrap?' wrap':'')+'">'+vHtml+'</span>'+
        '<button class="edit" data-step="'+step+'" aria-label="Modifier '+k+'">'+ic('edit')+'</button></div>';
    }
    area.innerHTML='<div class="recap">'+
      row('Lieu',esc(d.address||'—'),1,true)+
      row('Quand',whenLabel(d.when,d.whenSource),1)+
      row('Comportement',d.behaviors.map(function(b){return BLABEL[b];}).join(', ')||'—',2,true)+
      row('Plaque',plateBadge(info.fmt||info.raw),3)+
      row('Véhicule',(d.vehicle?ic(d.vehicle):'')+' '+(VLABEL[d.vehicle]||'—'),4)+
    '</div>';
    var send=nextBtn('Envoyer le signalement',function(){
      if(!d.plateNorm){d.plateNorm=info.raw;d.plateFmt=info.fmt||info.raw;}
      d._prev=(state.stats.get(d.plateNorm)||{count:0}).count;
      send.disabled=true; send.textContent='Envoi…';
      submitReport().then(function(ok){
        if(ok){d.step=6;renderDone();}
        else{send.disabled=false;send.textContent='Envoyer le signalement';}
      });
    });
    foot.appendChild(send);
    area.addEventListener('click',function(e){
      var b=e.target.closest('.edit'); if(!b)return;
      d.step=+b.dataset.step; renderStep();
    });
  }

  function submitReport(){
    var d=state.draft, info=plateInfo(d);
    var rec={
      id:uid(),
      plate:d.plateNorm||info.raw, plateFmt:d.plateFmt||info.fmt||info.raw,
      vehicle:d.vehicle, behaviors:d.behaviors.slice(),
      lat:d.loc.lat, lng:d.loc.lng, address:d.address||null,
      incidentTs:d.when||Date.now(),
      ts:Date.now(), reporter:state.reporterId
    };
    if(!state.store)return Promise.resolve(false);
    return state.store.addReport(rec).then(function(){return true;}).catch(function(err){
      console.warn('addReport',err); toast('Enregistrement impossible'); return false;
    });
  }

  function renderDone(){
    var d=state.draft, sh=$('#sheet');
    var total=(d._prev||0)+1, flagged=total>=2;
    sh.innerHTML=
      '<div class="sheet-head"><div class="rail"></div><button class="icon-btn" id="doneX" aria-label="Fermer">'+ic('close')+'</button></div>'+
      '<div class="sheet-body">'+
        '<div class="done '+(flagged?'flag':'ok')+'">'+
          '<div class="badge-ic">'+ic(flagged?'menace':'check')+'</div>'+
          (flagged
            ? '<h2>Signalé '+total+' fois</h2><p>Ce véhicule est maintenant marqué comme <b>chauffard</b> : point rouge sur la carte et fiche dédiée.</p>'
            : '<h2>C’est enregistré</h2><p>Merci — votre signalement aide les autres conducteurs. À 2 signalements, la plaque sera marquée comme chauffard.</p>')+
          plateBadge(d.plateFmt,'lg')+
          (flagged
            ? '<div class="notify" id="dNotify"><div class="notify-head">'+ic('bell')+'Me prévenir au prochain signalement'+
              '<button class="switch" id="dSwitch" role="switch" aria-checked="false"><span></span></button></div>'+
              '<div class="notify-body" id="dNotifyBody"><input type="email" id="dEmail" placeholder="votre@email.fr" autocomplete="email" inputmode="email">'+
              '<button class="btn btn-primary" id="dSaveEmail">Activer l’alerte</button>'+
              '<span class="hint">Enregistré'+(state.store&&state.store.isShared?'':' sur cet appareil')+'. L’envoi d’e-mail réel nécessite un service de messagerie ; en attendant, l’alerte s’affiche ici.</span></div></div>'
            : '')+
        '</div>'+
      '</div>'+
      '<div class="sheet-foot">'+
        '<button class="btn btn-ghost" id="doneMap">Voir sur la carte</button>'+
        '<button class="btn btn-primary" id="doneClose">Terminé</button>'+
      '</div>';
    $('#doneX').onclick=closeSheet; $('#doneClose').onclick=closeSheet;
    $('#doneMap').onclick=function(){
      var plate=d.plateNorm, ll=(d.loc?[d.loc.lat,d.loc.lng]:null);
      closeSheet();
      setTimeout(function(){ setView('carte'); state.selectedPlate=plate; renderPins(); if(ll&&map)map.setView(ll,15); openDetail(plate); },300);
    };
    if(flagged)wireNotify($('#dSwitch'),$('#dNotifyBody'),$('#dEmail'),$('#dSaveEmail'),$('#dNotify'),d.plateNorm,d.plateFmt);
  }

  /* =================== WIRING =================== */
  $('#btnInfo').innerHTML=ic('info');
  $('#locBtn').innerHTML=ic('crosshair');
  $('#seg').addEventListener('click',function(e){ var b=e.target.closest('button[data-view]'); if(b)setView(b.dataset.view); });
  $('#btnInfo').onclick=openInfo;
  $('#btnReport').onclick=function(){ openReport(null); };
  $('#locBtn').onclick=locateMe;
  $('#timeFilter').addEventListener('click',function(e){
    var b=e.target.closest('button[data-f]'); if(!b)return;
    state.filter=b.dataset.f; lsSet('chauffard_filter',state.filter);
    Array.prototype.forEach.call($('#timeFilter').querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',String(x.dataset.f===state.filter));});
    renderPins();
  });
  Array.prototype.forEach.call($('#timeFilter').querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',String(x.dataset.f===state.filter));});
  $('#chauffardList').addEventListener('click',function(e){ var c=e.target.closest('[data-plate]'); if(c)openDetail(c.dataset.plate); });
  $('#activiteList').addEventListener('click',function(e){ var c=e.target.closest('[data-plate]'); if(c)openDetail(c.dataset.plate); });

  // Clavier physique (bonus) : on relaie sur les touches du pavé à l'écran,
  // qui passent par le même repaint — pas de re-rendu complet de l'étape.
  document.addEventListener('keydown',function(e){
    if(state.sheetMode!=='report'||!state.draft||state.draft.step!==3)return;
    var pad=$('#pad'); if(!pad)return;
    var btn;
    if(e.key==='Backspace') btn=pad.querySelector('.key-back');
    else if(e.key.length===1){
      var k=e.key.toUpperCase();
      btn=Array.prototype.filter.call(pad.querySelectorAll('.key'),function(x){return x.dataset.k===k;})[0];
    }
    if(btn){ e.preventDefault(); if(!btn.disabled)btn.click(); }
  });

  /* =================== INIT =================== */
  initMap();
  setView(state.view);
  renderAll();

  makeStore().then(function(store){
    state.store=store;
    var chip=$('#demoChip');
    if(store.isShared){ chip.hidden=true; }
    else { chip.hidden=false; chip.textContent='Stockage local (cet appareil). Configure Firebase dans le fichier pour partager entre tous les visiteurs.'; }
    state.unsub=store.subscribeReports(function(reports){
      state.remote=(reports||[]).map(function(o){ if(!o.plateFmt)o.plateFmt=fmtFr(o.plate); return o; });
      renderAll();
    });
  }).catch(function(e){ console.warn('store init',e); });

})();
</script>
</body>
</html>
